<template>
  <style>
    /*GTA-THEME*/
    /* the validated values of this variant (lab listcounter/compositions/c.html) */
    #listcounter2-c[data-theme="clean"] {
      --lc-tfill: #ffffff;
      --lc-tbg: none;
      --lc-tclip: border-box;
      --lc-tshadow: drop-shadow(0 4px 24px rgba(0, 0, 0, 0.45));
      --lc-scolor: rgba(255, 255, 255, 0.72);
      --lc-seg-future: rgba(255, 255, 255, 0.26);
      --lc-seg-done: #ffffff;
      --lc-seg-done-img: none;
      --lc-seg-cur: #ffffff;
      --lc-shade: 0, 0, 0;
    }
    #listcounter2-c[data-theme="vice"] {
      /* full colour: "/48" in pink, done notches show their slice of one rail-wide gradient,
         the current notch is a full gradient, the items still to come are flamingo at 35 % */
      --lc-tfill: transparent;
      --lc-tbg: var(--grad);
      --lc-tclip: text;
      --lc-tshadow: drop-shadow(0 3px 0 rgba(36, 19, 41, 0.5)) drop-shadow(0 0 18px rgba(36, 19, 41, 0.5));
      --lc-scolor: var(--pink);
      --lc-seg-future: rgba(255, 98, 137, 0.35);
      --lc-seg-done: transparent;
      --lc-seg-done-img: var(--grad);
      --lc-seg-cur: var(--grad);
      --lc-shade: 36, 19, 41;
    }
    #listcounter2-c { position: absolute; inset: 0; overflow: hidden; }
    /* low shade so the rail reads on bright footage */
    #listcounter2-c-shade {
      position: absolute; left: 0; bottom: 0; width: 1920px; height: 240px;
      background: linear-gradient(to top, rgba(var(--lc-shade), 0.62) 0%, rgba(var(--lc-shade), 0.28) 45%, rgba(var(--lc-shade), 0) 100%);
    }
    /* the rail: one notch per item, bottom edge inside action-safe */
    #listcounter2-c-rail { position: absolute; left: 99px; top: 1014px; width: 1722px; height: 12px; }
    #listcounter2-c .seg {
      position: absolute; top: 0; height: 12px; border-radius: 2px; background: var(--lc-seg-future); overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }
    #listcounter2-c .seg .f {
      position: absolute; inset: 0; background-color: var(--lc-seg-done); background-image: var(--lc-seg-done-img);
      background-size: 1722px 100%; background-position: calc(-1 * var(--x, 0px)) 0;
    }
    /* the current item: a slightly taller notch that slides one step at each tick */
    #listcounter2-c-head {
      position: absolute; top: -3px; height: 18px; border-radius: 3px; background: var(--lc-seg-cur); box-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }
    /* tiny number, only at the tick: rises out of the rail above its own notch */
    #listcounter2-c-tag { position: absolute; top: 936px; height: 66px; width: 200px; clip-path: inset(0 -200px 0 -200px); }
    #listcounter2-c-ti { position: absolute; left: 0; top: 0; height: 66px; display: flex; align-items: baseline; white-space: nowrap; filter: var(--lc-tshadow); }
    #listcounter2-c-tn {
      font-family: var(--font-head); color: var(--lc-tfill); background-image: var(--lc-tbg); -webkit-background-clip: var(--lc-tclip);
      background-clip: var(--lc-tclip); font-size: 50px; line-height: 66px; font-weight: 800; letter-spacing: -0.02em; font-feature-settings: "tnum" 1;
    }
    #listcounter2-c-tt { margin-left: 4px; font-family: var(--font-body); font-size: 28px; font-weight: 600; color: var(--lc-scolor); }
  </style>
  <div id="listcounter2-c" data-composition-id="listcounter2-c" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "number", "type": "number", "label": "The item number (its place in the list)", "default": 11, "min": 1, "max": 100, "step": 1},
      {"id": "total", "type": "number", "label": "How many items the list has (one notch each)", "default": 48, "min": 2, "max": 100, "step": 1},
      {"id": "cut", "type": "number", "label": "The cut to this item is at (s); the rail wakes 0.2 s before it", "default": 0.2, "min": 0.2, "unit": "s"}
    ]'>
    <div id="listcounter2-c-shade" data-layout-ignore></div>
    <div id="listcounter2-c-tag" data-layout-allow-overflow>
      <div id="listcounter2-c-ti"><span id="listcounter2-c-tn">11</span><span id="listcounter2-c-tt">/48</span></div>
    </div>
    <div id="listcounter2-c-rail" data-layout-allow-overflow>
      <div id="listcounter2-c-head"></div>
    </div>
  </div>
  <script>
    (() => {
      const R = "listcounter2-c";
      const root = document.getElementById(R);
      // this scene's values (declared defaults + its host's values), read once
      const V = { theme: "clean", number: 11, total: 48, cut: 0.2 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const $ = (s) => document.getElementById(R + "-" + s);

      const N = Math.max(2, Math.min(100, Math.round(Number(V.total))));
      const n = Math.max(1, Math.min(N, Math.round(Number(V.number))));
      // the rail is 1722 px wide; 48 items = 36 px a notch (30 px + 6 px gap), as validated
      const P = (1722 + 6) / N, SW = P - 6;
      const rail = $("rail"), head = $("head");
      const fills = [];
      for (let k = 1; k <= N; k++) {
        const s = document.createElement("div");
        s.className = "seg";
        s.style.left = (k - 1) * P + "px";
        s.style.width = SW + "px";
        if (k <= n) {
          const fi = document.createElement("i");
          fi.className = "f";
          fi.style.setProperty("--x", (k - 1) * P + "px");
          s.appendChild(fi);
          fills[k] = fi;
        }
        rail.insertBefore(s, head);
      }
      head.style.width = SW + "px";
      head.style.left = (n - 2) * P + "px";
      $("tn").textContent = String(n);
      $("tt").textContent = "/" + N;
      const tag = $("tag");
      tag.style.left = 99 + (n - 1) * P + "px";

      // measure on an off-screen copy: a scene that starts later is still hidden when this runs, and the mounted
      // scene's rules are scoped to it (they never reach a copy outside it), so each copied element carries its
      // own computed type and box styles inline; the copy is dropped right after
      const KEEP = ["display", "position", "boxSizing", "whiteSpace", "verticalAlign", "alignItems", "fontFamily", "fontWeight",
        "fontStyle", "fontSize", "lineHeight", "letterSpacing", "wordSpacing", "fontFeatureSettings", "fontVariantNumeric",
        "fontKerning", "textTransform", "marginLeft", "marginRight", "paddingLeft", "paddingRight", "borderLeftWidth",
        "borderRightWidth", "borderLeftStyle", "borderRightStyle"];
      const offscreen = (els, fn) => {
        const box = document.createElement("div");
        box.style.cssText = "position: fixed; left: -9999px; top: 0; width: 1920px; height: 1080px; visibility: hidden; pointer-events: none;";
        const from = [], to = [];
        for (const el of els) {
          const copy = el.cloneNode(true);
          const a = [el, ...el.querySelectorAll("*")], b = [copy, ...copy.querySelectorAll("*")];
          a.forEach((e, i) => {
            const cs = getComputedStyle(e);
            for (const p of KEEP) b[i].style[p] = cs[p];
            b[i].removeAttribute("id");
            from.push(e);
            to.push(b[i]);
          });
          box.appendChild(copy);
        }
        document.body.appendChild(box);
        try {
          return fn((e) => to[from.indexOf(e)]);
        } finally {
          box.remove();
        }
      };
      const T = Number(V.cut);
      const DONE = 0.62; // opacity of a finished notch; the count-through flash lifts it to 1
      const build = () => {
        // keep the tag inside action-safe when the notch is near the right end
        // (a scene that starts later is still hidden here: measure on a styled off-screen copy, then drop it)
        const w = offscreen([$("ti")], (t) => t($("ti")).offsetWidth);
        if (99 + (n - 1) * P + w > 1824) tag.style.left = 1824 - w + "px";
        const tl = gsap.timeline({ paused: true });
        // at rest (relaxed): thin, dim; notches before this item done, the head on the previous item
        tl.fromTo(rail, { scaleY: 0.34, opacity: 0.72, transformOrigin: "50% 100%" }, { scaleY: 0.34, opacity: 0.72, duration: 0.01 }, 0);
        tl.fromTo($("shade"), { opacity: 0.55 }, { opacity: 0.55, duration: 0.01 }, 0);
        for (let k = 1; k <= n; k++) tl.fromTo(fills[k], { opacity: k < n ? DONE : 0 }, { opacity: k < n ? DONE : 0, duration: 0.01 }, 0);
        // awake around the tick
        tl.fromTo(rail, { scaleY: 0.34, opacity: 0.72 }, { scaleY: 1, opacity: 1, duration: 0.22, ease: "power3.out", immediateRender: false }, T - 0.2);
        tl.fromTo($("shade"), { opacity: 0.55 }, { opacity: 1, duration: 0.22, ease: "power2.out", immediateRender: false }, T - 0.2);
        tl.fromTo(rail, { scaleY: 1, opacity: 1 }, { scaleY: 0.34, opacity: 0.72, duration: 0.4, ease: "power2.inOut", immediateRender: false }, T + 1.5);
        tl.fromTo($("shade"), { opacity: 1 }, { opacity: 0.55, duration: 0.4, ease: "power2.inOut", immediateRender: false }, T + 1.5);
        // a flash counts through every finished item, left to right, and hands over to the head
        for (let k = 1; k < n; k++) {
          const tk = T - 0.12 + (k - 1) * 0.016;
          tl.fromTo(fills[k], { opacity: DONE }, { opacity: 1, duration: 0.05, ease: "none", immediateRender: false }, tk);
          tl.fromTo(fills[k], { opacity: 1 }, { opacity: DONE, duration: 0.16, ease: "power1.out", immediateRender: false }, tk + 0.05);
        }
        // the head slides one notch (the first item has no previous notch: the head starts on it)
        if (n > 1) tl.fromTo(head, { x: 0 }, { x: P, duration: 0.26, ease: "power3.inOut" }, T - 0.04);
        else tl.fromTo(head, { x: P }, { x: P, duration: 0.01 }, 0);
        // the new notch fills underneath it
        tl.fromTo(fills[n], { opacity: 0 }, { opacity: DONE, duration: 0.01, immediateRender: false }, T + 0.22);
        // tiny number: up out of the rail, holds about 1.3 s, back down
        tl.fromTo($("ti"), { y: 66 }, { y: 0, duration: 0.32, ease: "expo.out" }, T + 0.04);
        tl.fromTo($("ti"), { y: 0 }, { y: 66, duration: 0.2, ease: "power3.in", immediateRender: false }, T + 1.4);
        tl.set({}, {}, T + 1.9);
        window.__timelines["listcounter2-c"] = tl;
      };
      // the tag is measured in the real font, so wait for it
      document.fonts.load("800 50px " + (V.theme === "vice" ? "GSora" : "Inter"), "0123456789").catch(() => {}).then(build);
    })();
  </script>
</template>
