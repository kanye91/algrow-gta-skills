<template>
  <style>
    /*GTA-THEME*/
    #nametag-a2 { position: absolute; inset: 0; overflow: hidden; }
    #nametag-a2 *, #nametag-a2 *::before, #nametag-a2 *::after { box-sizing: border-box; margin: 0; }
    /* nametag-A without its box: the plate and its typing are nametag-A's; a thin arrow (the brackets' 5 px stroke)
       shoots from the plate to the person. The role line is full white (lighter weight, smaller), never see-through. */
    #nametag-a2[data-theme="clean"] {
      --na2-plate: rgba(11, 10, 17, 0.88);
      --na2-radius: 3px;
      --na2-name-size: 50px;
      --na2-name-ls: 0.005em;
      --na2-role: #ffffff;
      --na2-role-w: 500;
    }
    #nametag-a2[data-theme="vice"] {
      --na2-plate: rgba(36, 19, 41, 0.9);
      --na2-radius: 12px;
      --na2-name-size: 46px;
      --na2-name-ls: 0em;
      --na2-role: var(--pink);
      --na2-role-w: 600;
    }
    #nametag-a2-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    /* a tight dark edge + the soft mark shadow, so a white arrow still reads on bright footage */
    #nametag-a2-arrow { filter: drop-shadow(0 0 1.5px rgba(0, 0, 0, 0.6)) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.45)); }
    #nametag-a2[data-theme="vice"] #nametag-a2-arrow { filter: drop-shadow(0 0 1.5px rgba(36, 19, 41, 0.7)) drop-shadow(0 2px 8px rgba(36, 19, 41, 0.5)); }
    #nametag-a2-plate {
      position: absolute; left: 0; top: 0; width: max-content;
      background: var(--na2-plate); border-radius: var(--na2-radius); padding: 19px 24px 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28); clip-path: inset(0px 100% 47px 0px);
    }
    #nametag-a2-name {
      width: fit-content; color: #ffffff; font-family: var(--font-head); font-weight: 800; font-size: var(--na2-name-size);
      line-height: 38px; letter-spacing: var(--na2-name-ls); white-space: nowrap; text-transform: uppercase;
    }
    #nametag-a2[data-theme="vice"] #nametag-a2-name {
      color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text;
    }
    #nametag-a2-role {
      margin-top: 18px; padding-bottom: 20px; min-height: 48px; color: var(--na2-role); font-family: var(--font-body);
      font-weight: var(--na2-role-w); font-size: 28px; line-height: 28px; letter-spacing: -0.005em; white-space: nowrap;
    }
  </style>
  <div id="nametag-a2" data-composition-id="nametag-a2" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "name", "type": "string", "label": "Name (shown in capitals)", "default": "", "maxLength": 20},
      {"id": "role", "type": "string", "label": "One line about them (empty = name only)", "default": "", "maxLength": 40},
      {"id": "headX", "type": "number", "label": "Head point x: the edge of the head on the plate side, at eye level (below: the chin)", "default": 1170, "min": 96, "max": 1824, "unit": "px"},
      {"id": "headY", "type": "number", "label": "Head point y", "default": 410, "min": 54, "max": 1026, "unit": "px"},
      {"id": "side", "type": "enum", "label": "Where the plate goes", "default": "right", "options": [{"value": "right", "label": "Right of the head"}, {"value": "left", "label": "Left of the head"}, {"value": "below", "label": "Under the chin"}]},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 2.7667, "min": 1.1, "unit": "s"}
    ]'>
    <svg id="nametag-a2-svg" data-layout-ignore>
      <defs>
        <linearGradient id="nametag-a2-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
          <stop offset="0" stop-color="#FFBE48" /><stop offset="1" stop-color="#FF6289" />
        </linearGradient>
      </defs>
      <g id="nametag-a2-arrow" fill="none" stroke-width="5">
        <path id="nametag-a2-shaft" stroke-linecap="butt" />
        <path id="nametag-a2-head" stroke-linecap="butt" stroke-linejoin="miter" opacity="0" />
      </g>
    </svg>
    <div id="nametag-a2-plate" data-layout-allow-overflow>
      <div id="nametag-a2-name"></div>
      <div id="nametag-a2-role"></div>
    </div>
  </div>
  <script>
    (() => {
      const R = "nametag-a2";
      const root = document.getElementById(R);
      // this scene's values (its declared defaults + its host's values). Read them here, once.
      const V = { theme: "clean", name: "", role: "", headX: 1170, headY: 410, side: "right", out: 2.7667 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const vice = V.theme === "vice";
      root.dataset.theme = vice ? "vice" : "clean";
      const $ = (s) => document.getElementById(`${R}-${s}`);
      const name = String(V.name || ""), role = String(V.role || "").trim();
      $("name").textContent = name;
      $("role").textContent = role;
      if (!role) $("role").style.visibility = "hidden";

      const build = () => {
        // the plate's width (canvas, once the fonts are loaded: works while the scene is still hidden)
        let wn = 0, wr = 0;
        try {
          const ctx = document.createElement("canvas").getContext("2d");
          const cn = getComputedStyle($("name")), cr = getComputedStyle($("role"));
          ctx.font = `${cn.fontWeight} ${cn.fontSize} ${cn.fontFamily}`; ctx.letterSpacing = cn.letterSpacing;
          wn = ctx.measureText(name.toUpperCase()).width;
          ctx.font = `${cr.fontWeight} ${cr.fontSize} ${cr.fontFamily}`; ctx.letterSpacing = cr.letterSpacing;
          wr = role ? ctx.measureText(role).width : 0;
        } catch (e) {}
        if (!(wn > 0)) wn = name.length * 34;
        const PW = Math.ceil(Math.max(wn, wr)) + 48, PH = role ? 123 : 76;

        // the arrow: its tip stops 20 px off the head point, 110 px long; the plate starts 16 px past its tail.
        // Right / left: horizontal at the point's height, the name row centred on it. Below: it points up at the chin,
        // and the plate runs outward (toward the nearer frame edge) from under the arrow.
        const P = [Number(V.headX), Number(V.headY)];
        const side = V.side === "left" || V.side === "below" ? V.side : "right";
        let tip, tail, d, px, py;
        if (side === "below") {
          tip = [P[0], P[1] + 20]; tail = [P[0], P[1] + 130]; d = [0, -1];   // d: the way the arrow points
          py = tail[1] + 16;
          px = P[0] < 960 ? P[0] + 48 - PW : P[0] - 48;
        } else {
          const s = side === "right" ? 1 : -1;
          tip = [P[0] + 20 * s, P[1]]; tail = [P[0] + 130 * s, P[1]]; d = [-s, 0];
          px = s > 0 ? tail[0] + 16 : tail[0] - 16 - PW;
          py = P[1] - 38;
        }
        px = Math.max(96, Math.min(1824 - PW, px));
        py = Math.max(54, Math.min(1026 - PH, py));
        const plate = $("plate");
        plate.style.left = `${Math.round(px)}px`;
        plate.style.top = `${Math.round(py)}px`;
        // open head: two 26 px legs at 42 degrees off the shaft
        const L = 26, ca = Math.cos((42 * Math.PI) / 180), sa = Math.sin((42 * Math.PI) / 180);
        const back = [-d[0], -d[1]], perp = [-d[1], d[0]];
        const leg = (k) => [tip[0] + L * (ca * back[0] + k * sa * perp[0]), tip[1] + L * (ca * back[1] + k * sa * perp[1])];
        const l1 = leg(1), l2 = leg(-1);
        const shaft = $("shaft"), head = $("head");
        shaft.setAttribute("d", `M${tail[0]} ${tail[1]} L${tip[0] - 2 * d[0]} ${tip[1] - 2 * d[1]}`);
        head.setAttribute("d", `M${l1[0]} ${l1[1]} L${tip[0]} ${tip[1]} L${l2[0]} ${l2[1]}`);
        const g = $("grad");
        g.setAttribute("x1", tail[0]); g.setAttribute("y1", tail[1]); g.setAttribute("x2", tip[0] + (side === "below" ? 0.01 : 0)); g.setAttribute("y2", tip[1]);
        const stroke = vice ? `url(#${R}-grad)` : "#ffffff";
        shaft.setAttribute("stroke", stroke); head.setAttribute("stroke", stroke);
        const len = 108;

        const F = (f) => f / 30;
        const out = Number(V.out);
        const tl = gsap.timeline({ paused: true });
        // the arrow shoots from the plate side to the person (f3-f9), its head bites like nametag-A's brackets (f8-f12)
        tl.fromTo(shaft, { attr: { "stroke-dasharray": `${len} ${len}`, "stroke-dashoffset": len } }, { attr: { "stroke-dashoffset": 0 }, duration: F(6), ease: "power3.out" }, F(3));
        const o = `${tip[0]} ${tip[1]}`;
        tl.fromTo(head, { scale: 1.15, opacity: 0, svgOrigin: o }, { scale: 1.15, opacity: 0.4, svgOrigin: o, duration: F(1), ease: "none" }, F(8));
        tl.to(head, { scale: 1, opacity: 1, duration: F(4), ease: "power2.out", immediateRender: false }, F(9));
        // plate: a 1-frame tick at its edge (f11), then the edge grows and types the name (f12-f19), as nametag-A
        tl.fromTo(plate, { clipPath: "inset(0px 100% 47px 0px)" }, { clipPath: "inset(0px 97.84% 47px 0px)", duration: F(1), ease: "none" }, F(11));
        tl.fromTo(plate, { clipPath: "inset(0px 97.84% 47px 0px)" }, { clipPath: "inset(0px 0% 47px 0px)", duration: F(7), ease: "none", immediateRender: false }, F(12));
        let low = 47;
        if (role) {
          // role line: the plate drops one row and the line settles (nametag-A)
          tl.fromTo(plate, { clipPath: "inset(0px 0% 47px 0px)" }, { clipPath: "inset(0px 0% 0px 0px)", duration: F(7), ease: "power3.out", immediateRender: false }, F(21));
          tl.fromTo($("role"), { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: F(9), ease: "power3.out" }, F(22));
          low = 0;
        }
        // out (7 frames): the plate folds back into its edge, the arrow pulls back into the plate side
        tl.fromTo(plate, { clipPath: `inset(0px 0% ${low}px 0px)` }, { clipPath: `inset(0px 100% ${low}px 0px)`, duration: F(6), ease: "power2.in", immediateRender: false }, out);
        tl.to(head, { scale: 1.04, opacity: 0, duration: F(4), ease: "power2.in", immediateRender: false }, out + F(1));
        tl.to(shaft, { attr: { "stroke-dashoffset": len }, duration: F(6), ease: "power2.in", immediateRender: false }, out + F(1));
        tl.set({}, {}, out + F(7));
        window.__timelines[R] = tl;
      };
      let fontReady = Promise.resolve();
      try {
        const cs = getComputedStyle($("name"));
        fontReady = Promise.all([document.fonts.load(`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`, name.toUpperCase() || "A"), document.fonts.ready]);
      } catch (e) {}
      fontReady.then(build, build);
    })();
  </script>
</template>
