<template>
  <style>
    /*GTA-THEME*/
    #caption5-b { position: absolute; inset: 0; overflow: hidden; }
    /* the validated headline: its own tracking, shadow and optical nudge onto the centre line */
    #caption5-b[data-theme="clean"] {
      --cap-head-color: #ffffff; --cap-head-ls: -0.03em; --cap-head-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      --cap-head-filter: none; --cap-head-ml: -4px;
    }
    #caption5-b[data-theme="vice"] {
      --cap-head-color: #ffbe48; --cap-head-ls: 0.005em; --cap-head-shadow: none;
      --cap-head-filter: drop-shadow(0 0 1.5px rgba(36, 19, 41, 0.95)) drop-shadow(0 4px 0 rgba(36, 19, 41, 0.8)) drop-shadow(0 0 22px rgba(36, 19, 41, 0.6));
      --cap-head-ml: 0px;
    }
    /* vice: each word filled with its slice of one marigold to flamingo ramp (--g0 / --g1, set by the script) */
    #caption5-b[data-theme="vice"] .w {
      background-image: linear-gradient(90deg, var(--g0, #ffbe48), var(--g1, #ff6289)); -webkit-background-clip: text;
      background-clip: text; color: transparent; padding: 0 0.04em; margin-left: -0.04em; margin-right: -0.04em;
    }
    #caption5-b .w { display: inline-block; }
    #caption5-b-cap { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; }
    #caption5-b-head {
      font-family: var(--font-head); font-weight: 800; color: var(--cap-head-color); font-size: 124px; line-height: 1.04;
      letter-spacing: var(--cap-head-ls); text-align: center; white-space: nowrap; text-shadow: var(--cap-head-shadow);
      filter: var(--cap-head-filter); margin-left: var(--cap-head-ml);
    }
    /* the source box (96 px tall here, as validated): a sentence that ends on the outlet's logo, or on its name */
    #caption5-b-src {
      margin-top: 48px; height: 96px; padding: 0 32px; border-radius: 20px; background: var(--box-bg); display: flex; align-items: center;
      box-shadow: var(--box-shadow); transform-origin: center center;
    }
    #caption5-b-srcw {
      font-family: var(--font-body); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: -0.01em;
      white-space: nowrap; color: var(--box-ink);
    }
    #caption5-b-logo { display: block; width: auto; height: 39.36px; margin-left: 22px; }
  </style>
  <div id="caption5-b" data-composition-id="caption5-b" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "line1", "type": "string", "label": "Claim, first line (the voice words)", "default": "", "maxLength": 20},
      {"id": "line2", "type": "string", "label": "Claim, second line (empty = one line)", "default": "", "maxLength": 20},
      {"id": "source", "type": "string", "label": "Source words before the outlet", "default": "Reported by", "maxLength": 16},
      {"id": "outlet", "type": "string", "label": "Outlet name (shown as text when there is no logo)", "default": "", "maxLength": 32},
      {"id": "logo", "type": "string", "label": "Outlet logo file (empty = the name as text)", "default": ""},
      {"id": "logo_h", "type": "number", "label": "Logo height", "default": 39.36, "min": 20, "max": 68, "unit": "px"},
      {"id": "logo_trim", "type": "number", "label": "Space taken off after the logo", "default": 0, "min": 0, "max": 24, "unit": "px"},
      {"id": "source_at", "type": "number", "label": "Source box lands at (s)", "default": 0.7333, "min": 0.3, "unit": "s"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.3333, "min": 1.8, "unit": "s"}
    ]'>
    <div id="caption5-b-cap" data-layout-allow-overflow>
      <div id="caption5-b-head" data-layout-allow-overflow></div>
      <div id="caption5-b-src"><span id="caption5-b-srcw"></span><img id="caption5-b-logo" alt="" /></div>
    </div>
  </div>
  <script>
    (() => {
      const ID = "caption5-b";
      // this scene's values (declared defaults + the host's values). Read once: the declaration is gone once mounted.
      const V = { theme: "clean", line1: "", line2: "", source: "Reported by", outlet: "", logo: "", logo_h: 39.36, logo_trim: 0, source_at: 0.7333, out: 4.3333 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#caption5-b, [data-composition-id="caption5-b"]').forEach((el) => el.setAttribute("data-theme", theme));
      const $ = (s) => document.getElementById(ID + s);

      // the claim: two centred lines, one span per word (vice gives each word its slice of one ramp across both lines)
      const head = $("-head");
      const words = [];
      [V.line1, V.line2].map((l) => String(l || "").trim()).filter(Boolean).forEach((line, li) => {
        if (li) head.appendChild(document.createElement("br"));
        line.split(/\s+/).forEach((w, i) => {
          if (i) head.appendChild(document.createTextNode(" "));
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = w;
          words.push(head.appendChild(s));
        });
      });
      const SUN = [255, 190, 72], FLAM = [255, 98, 137];
      const mix = (t) => `rgb(${SUN.map((c, i) => Math.round(c + (FLAM[i] - c) * t)).join(",")})`;
      const total = words.reduce((n, w) => n + w.textContent.length, 0) || 1;
      let seen = 0;
      words.forEach((w) => { w.style.setProperty("--g0", mix(seen / total)); seen += w.textContent.length; w.style.setProperty("--g1", mix(seen / total)); });

      // the source: "Reported by [logo]"; no logo file = the outlet's name as text (a logo is never invented)
      const logo = $("-logo"), hasLogo = !!String(V.logo || "").trim();
      if (hasLogo) {
        $("-srcw").textContent = String(V.source || "");
        logo.src = V.logo;
        logo.alt = String(V.outlet || "");
        logo.style.height = Number(V.logo_h) + "px";
        logo.style.marginRight = -Number(V.logo_trim) + "px";
      } else {
        $("-srcw").textContent = `${V.source || ""} ${V.outlet || ""}`.trim();
        logo.style.display = "none";
      }

      const F = (f) => f / 30;
      const at = Number(V.source_at), out = Number(V.out);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(head, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: F(14), ease: "power3.out" }, F(8));
      // the source box lands once the claim has been said
      tl.fromTo($("-src"), { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: F(11), ease: "power3.out" }, at);
      tl.to([head, $("-src")], { opacity: 0, y: 8, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(7));
      window.__timelines["caption5-b"] = tl;
    })();
  </script>
</template>
