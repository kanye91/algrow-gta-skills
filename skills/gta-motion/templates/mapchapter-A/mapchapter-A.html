        for (const g of ["flash", "tint", "outline"]) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", d);
          el(g).appendChild(p);
          if (g === "outline") { outlines.push(p); lens.push(plen(pts(d), true) + 2); }
        }
      }
      outlines.forEach((p, i) => { p.style.strokeDasharray = lens[i]; p.style.strokeDashoffset = lens[i]; });

      // the route: measured from its own points (no layout needed)
      let RL = 0, cum = [0];
      const car = { p: 0 };
      const placeCar = () => {
        const want = car.p * RL;
        let i = 1;
        while (i < cum.length - 1 && cum[i] < want) i++;
        const a = RT.p[i - 1], b = RT.p[i], seg = cum[i] - cum[i - 1], u = seg > 0 ? (want - cum[i - 1]) / seg : 0;
        gsap.set(el("car"), { x: a[0] + (b[0] - a[0]) * u, y: a[1] + (b[1] - a[1]) * u });
        const off = RL * (1 - car.p);
        el("route").style.strokeDashoffset = off;
        el("route-case").style.strokeDashoffset = off;
        el("miles").textContent = (RT.miles * car.p).toFixed(1);
      };
      if (RT) {
        for (let i = 1; i < RT.p.length; i++) cum.push(cum[i - 1] + Math.hypot(RT.p[i][0] - RT.p[i - 1][0], RT.p[i][1] - RT.p[i - 1][1]));
        RL = cum[cum.length - 1];
        const d = dOf(RT.p);
        for (const [id, w] of [["route-case", 12], ["route", 7]]) {
          el(id).setAttribute("d", d);
          el(id).setAttribute("stroke-width", (w * kR).toFixed(2));
          el(id).style.strokeDasharray = RL + 2;
          el(id).style.strokeDashoffset = RL;
        }
        const s = RT.p[0], e = RT.p[RT.p.length - 1], rg = el("rg");
        rg.setAttribute("x1", s[0]); rg.setAttribute("y1", s[1]); rg.setAttribute("x2", e[0]); rg.setAttribute("y2", e[1]);
        // "FROM → TO": vice's GJakarta has the arrow; HyperFrames' Inter (clean) has not, and each machine would draw it from its
        // own fallback font, so clean draws it as an SVG in the label colour (viewBox in px at the label's 18 px)
        const k = el("chip-k"), label = DATA.regions[RT.from].short + " → " + DATA.regions[RT.to].short;
        if (vice) k.textContent = label;
        else label.split("→").forEach((part, i) => {
          if (i) k.insertAdjacentHTML("beforeend", '<svg class="mc-arrow" viewBox="0 0 20.34 9" fill="none" stroke="currentColor" aria-hidden="true">' +
            '<path d="M0.98 4.44H16.72" stroke-width="1"/><path d="M13.42 1.73L17.32 4.44L13.42 7.15" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/></svg>');
          k.append(part);
        });
        gsap.set(el("car-s"), { scale: 1.45 * kR });
        placeCar();
      } else {
        for (const id of ["car", "route", "route-case"]) el(id).style.display = "none";
      }

      // text: one span per character (a space is a no-break space so it keeps its width in an inline-block span);
      // in vice each letter takes its slice of one sun-to-flamingo ramp
      const SUN = [255, 190, 72], FLAM = [255, 98, 137];
      const mix = (t) => `rgb(${SUN.map((c, i) => Math.round(c + (FLAM[i] - c) * t)).join(",")})`;
      const spans = (host, text, ramp) => {
        const chars = [...String(text)];
        return chars.map((ch, i) => {
          const s = document.createElement("span");
          s.textContent = ch === " " ? " " : ch;
          if (ramp) { s.style.setProperty("--g0", mix(i / chars.length)); s.style.setProperty("--g1", mix((i + 1) / chars.length)); }
          host.appendChild(s);
          return s;
        });
      };
      const titleChars = spans(el("title"), str(V.title) || R.title, vice);
      const hasSub = !!str(V.sub);
      const subChars = hasSub ? spans(el("sub"), str(V.sub), false) : [];
      if (!hasSub) el("sub").style.display = "none";
      const hasCard = !!str(V.postcard);
      if (hasCard) {
        const img = document.createElement("img");
        img.src = str(V.postcard);
        img.alt = "";
        el("card").insertBefore(img, el("cap"));
        el("cap").textContent = str(V.caption) || "Greetings from " + R.name;
      } else el("card").style.display = "none";

      const ICONS = {
        anchor: '<circle cx="12" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7.2V20M8 11h8M4.5 13.5a7.5 7.5 0 0 0 15 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 14.5l1.5-2.5 2 2.2M21 14.5l-1.5-2.5-2 2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
        cup: '<path d="M4.5 10h12v4.5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z" fill="currentColor"/><path d="M16.5 11.5h1.2a2.3 2.3 0 0 1 0 4.6h-1.6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 3.5c-1 1.2 1 2 0 3.5M12.5 3.5c-1 1.2 1 2 0 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
        palm: '<path d="M12.5 9c-.3 4 .3 8 1.8 12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/><path d="M12.5 9C10 6 6.5 6 4 7.5c3-.2 5.5.6 8.5 1.5zM12.5 9c2-3 6-3.6 8-2-3 0-5.5.9-8 2zM12.5 9c-1-3.5-.2-5.8 2.5-7-1 2.3-1.5 4.5-2.5 7zM12.5 9C9.5 9.5 7 12 6.5 15c1.8-2.8 3.8-4.5 6-6z" fill="currentColor"/>',
        star: '<path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1.1 5.9L12 16.6l-5.3 2.8 1.1-5.9-4.3-4.1 5.9-.8z" fill="currentColor"/>',
        plane: '<path d="M21 15.6v-1.9l-7.6-4.7V4.3a1.4 1.4 0 0 0-2.8 0V9L3 13.7v1.9l7.6-2.4v4.5l-2 1.5v1.4l3.4-1 3.4 1v-1.4l-2-1.5v-4.5z" fill="currentColor"/>',
        car: '<path fill="currentColor" d="M5 11l1.6-4.2A2 2 0 0 1 8.5 5.5h7a2 2 0 0 1 1.9 1.3L19 11a2 2 0 0 1 1.5 1.9V17a1 1 0 0 1-1 1h-1a2 2 0 0 1-4 0h-5a2 2 0 0 1-4 0h-1a1 1 0 0 1-1-1v-4.1A2 2 0 0 1 5 11zm2.2 0h9.6l-1.2-3.3a.6.6 0 0 0-.6-.4H9a.6.6 0 0 0-.6.4z"/>',
      };
      const pinScale = c0 ? 2 / (c0.zoom + c1.zoom) : 1;
      for (const p of pins) {
        const a = document.createElement("div");
        a.className = "mc-anchor" + (p.low ? " mc-low" : "");
        a.style.left = p.x.toFixed(1) + "px";
        a.style.top = p.y.toFixed(1) + "px";
        const s = document.createElement("div");
        s.className = "mc-s";
        s.style.transform = `scale(${pinScale.toFixed(4)})`;
        s.innerHTML = '<div class="mc-ring"></div><div class="mc-dot"></div>' +
          `<div class="mc-icon"><svg width="34" height="34" viewBox="0 0 24 24">${ICONS[p.icon] || ICONS.star}</svg></div>` +
          '<div class="mc-label"><div class="mc-l1"></div><div class="mc-l2"></div></div>';
        if (p.photo) {
          const ph = document.createElement("div"), img = document.createElement("img");
          ph.className = "mc-photo";
          img.src = p.photo;
          img.alt = "";
          ph.appendChild(img);
          s.insertBefore(ph, s.querySelector(".mc-icon"));
        }
        a.appendChild(s);
        el("pins").appendChild(a);
        p.el = s;
        p.l1 = spans(s.querySelector(".mc-l1"), p.label, vice);
        p.l2 = p.real ? spans(s.querySelector(".mc-l2"), p.real, false) : [];
        if (!p.real) s.querySelector(".mc-l2").style.display = "none";
      }

      // ---- timing: the validated chapter (title at 4.12 s, out at 8.15 s), shifted onto the words ----
      const END = Number(V.out);
      const T = RT ? Math.max(4.12, Number(V.title_at)) : Math.max(0.6, Number(V.title_at));
      const O = Math.max(T + 0.8, pins.length ? Number(V.title_out) : Math.min(Number(V.title_out), END - 0.45));
      const tl = gsap.timeline({ paused: true });
      const start = RT ? r0 : wide;
      gsap.set(el("zoom"), { transformOrigin: "960px 540px", scale: start.zoom });
      gsap.set(el("pan"), { x: 960 - start.x, y: 540 - start.y });
      let first = true;
      const cam = (t, dur, a, b, ease) => {
        const ir = first;
        first = false;
        tl.fromTo(el("pan"), { x: 960 - a.x, y: 540 - a.y }, { x: 960 - b.x, y: 540 - b.y, duration: dur, ease, immediateRender: ir }, t);
        tl.fromTo(el("zoom"), { scale: a.zoom }, { scale: b.zoom, duration: dur, ease, immediateRender: ir }, t);
      };

      // 1. the route: the car drives the real road, the line draws behind it, the mileage counts up
      if (RT) {
        tl.fromTo(el("cardot"), { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 0.15);
        tl.fromTo(el("chip"), { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 0.3);
        cam(0.4, 3.0, r0, r1, "power1.inOut");
        tl.fromTo(car, { p: 0 }, { p: 1, duration: 2.9, ease: "power1.inOut", onUpdate: placeCar, immediateRender: false }, 0.45);
        tl.fromTo(el("cardot"), { scale: 1 }, { scale: 1.18, duration: 0.14, yoyo: true, repeat: 1, ease: "power1.inOut", immediateRender: false }, 3.36);
        tl.to([el("car"), el("route"), el("route-case")], { opacity: 0, duration: 0.3, ease: "power1.out" }, T - 0.47);
      }

      // 2. the region: push in, the world outside goes quiet, the title rises, the outline draws, the postcard slides in
      const camIn = Math.max(0, T - 0.57);
      cam(camIn, T + 0.48 - camIn, RT ? r1 : wide, t0, "power2.inOut");
      cam(T + 0.48, Math.max(0.5, (pins.length ? O + 0.15 : END) - (T + 0.48)), t0, t1, "sine.inOut");
      tl.fromTo(el("grad"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, T - 0.22);
      tl.fromTo(el("dim"), { opacity: 0 }, { opacity: 0.42, duration: 0.4, ease: "power1.out" }, T - 0.17);
      tl.fromTo(titleChars, { yPercent: 110, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.24, ease: "power3.out", stagger: 0.034 }, T);
      subChars.forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, T + 0.38 + i * 0.03));
      tl.fromTo(el("flash"), { opacity: 0 }, { opacity: 0.6, duration: 0.13, ease: "power1.out" }, T + 0.38);
      tl.to(el("flash"), { opacity: 0, duration: 0.4, ease: "power1.in" }, T + 0.54);
      tl.fromTo(el("tint"), { opacity: 0 }, { opacity: 0.24, duration: 0.4, ease: "power1.out" }, T + 0.5);
      outlines.forEach((p, i) => tl.fromTo(p, { strokeDashoffset: lens[i] }, { strokeDashoffset: 0, duration: 0.42, ease: "power2.inOut" }, T + 0.43 + Math.min(i, 12) * 0.02));
      if (hasCard) tl.fromTo(el("card"), { x: -860, opacity: 1 }, { x: 0, duration: 0.38, ease: "back.out(1.3)" }, T + 0.88);
      tl.fromTo(el("outline"), { attr: { "stroke-width": 2.4 * kT } }, { attr: { "stroke-width": 3.4 * kT }, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, T + 1.48);
      // exit: the title slides out left, the postcard after it, then the region lets go
      tl.to(hasSub ? [el("titlebox"), el("sub")] : [el("titlebox")], { x: -60, opacity: 0, duration: 0.26, ease: "power2.in", stagger: 0.03 }, O);
      if (hasCard) tl.to(el("card"), { x: -700, duration: 0.3, ease: "power2.in" }, O);
      tl.to(el("grad"), { opacity: 0, duration: 0.3, ease: "power1.in" }, O + 0.15);
      tl.to([el("dim"), el("tint"), el("outline")], { opacity: 0, duration: 0.3, ease: "power1.in" }, O + 0.15);

      // 3. the city: the camera dives in (the close-up map fades in when every pin is on it), the pins land on their words
      if (pins.length) {
        cam(O + 0.15, 1.5, t1, c0, "power3.inOut");
        if (useDetail) tl.fromTo(el("detail"), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.inOut" }, O + 0.8);
        cam(O + 1.65, Math.max(0.5, END - (O + 1.65)), c0, c1, "none");
        for (const p of pins) {
          const t = p.t, q = (s) => p.el.querySelector(s);
          tl.fromTo(q(".mc-dot"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.16, ease: "back.out(2)" }, t);
          // the ring: hidden until its pin lands, then one ping
          tl.fromTo(q(".mc-ring"), { scale: 0.3, opacity: 0 }, { scale: 0.3, opacity: 0.95, duration: 0.001 }, t);
          tl.fromTo(q(".mc-ring"), { scale: 0.3, opacity: 0.95 }, { scale: 1.9, opacity: 0, duration: 0.75, ease: "power2.out", immediateRender: false }, t + 0.001);
          tl.fromTo(q(".mc-icon"), { scale: 0, opacity: 0, transformOrigin: "50% 100%" }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, t + 0.04);
          tl.fromTo(q(".mc-label"), { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.2, ease: "power2.out" }, t + 0.18);
          p.l1.forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t + 0.22 + i * 0.033));
          const t2 = t + 0.22 + p.l1.length * 0.033 + 0.04;
          p.l2.forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t2 + i * 0.022));
          if (p.photo) tl.fromTo(q(".mc-photo"), { opacity: 0, y: 26, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.34, ease: "back.out(1.6)" }, t + 0.32);
        }
      }
      tl.set({}, {}, END);
      window.__timelines["mapchapter-a"] = tl;
    })();
  </script>
</template>
