<template>
  <style>
    /*GTA-THEME*/
    #caption5-c { position: absolute; inset: 0; overflow: hidden; }
    /* soft neutral dim behind the upper-left claim, comes and goes with the graphic (was baked into the lab footage) */
    #caption5-c-dim {
      position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(1150px 400px at 620px 420px, rgba(0, 0, 0, 0.34) 0%, rgba(0, 0, 0, 0.33) 10%, rgba(0, 0, 0, 0.305) 20%,
        rgba(0, 0, 0, 0.267) 30%, rgba(0, 0, 0, 0.22) 40%, rgba(0, 0, 0, 0.17) 50%, rgba(0, 0, 0, 0.12) 60%, rgba(0, 0, 0, 0.073) 70%,
        rgba(0, 0, 0, 0.035) 80%, rgba(0, 0, 0, 0.01) 90%, rgba(0, 0, 0, 0) 100%);
    }
    /* the validated headline: its own tracking, shadow and optical nudges onto the x 120 edge */
    #caption5-c[data-theme="clean"] {
      --cap-head-color: #ffffff; --cap-head-ls: -0.03em; --cap-head-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      --cap-head-filter: none; --cap-l1-nudge: -5px; --cap-l2-nudge: -4px;
    }
    #caption5-c[data-theme="vice"] {
      --cap-head-color: #ffbe48; --cap-head-ls: 0.005em; --cap-head-shadow: none;
      --cap-head-filter: drop-shadow(0 0 1.5px rgba(36, 19, 41, 0.95)) drop-shadow(0 4px 0 rgba(36, 19, 41, 0.8)) drop-shadow(0 0 22px rgba(36, 19, 41, 0.6));
      --cap-l1-nudge: -4.5px; --cap-l2-nudge: -3.5px;
    }
    /* vice: each word filled with its slice of one marigold to flamingo ramp (--g0 / --g1, set by the script) */
    #caption5-c[data-theme="vice"] .w {
      background-image: linear-gradient(90deg, var(--g0, #ffbe48), var(--g1, #ff6289)); -webkit-background-clip: text;
      background-clip: text; color: transparent; padding: 0 0.04em; margin-left: -0.04em; margin-right: 0.2em;
    }
    #caption5-c-cap { position: absolute; left: 120px; top: 268px; display: flex; flex-direction: column; align-items: flex-start; }
    #caption5-c-head { filter: var(--cap-head-filter); }
    #caption5-c .line {
      font-family: var(--font-head); font-weight: 800; color: var(--cap-head-color); font-size: 108px; line-height: 1.04;
      letter-spacing: var(--cap-head-ls); white-space: nowrap; text-shadow: var(--cap-head-shadow);
    }
    #caption5-c .line:first-child { margin-left: var(--cap-l1-nudge); }
    #caption5-c .line + .line { margin-left: var(--cap-l2-nudge); }
    #caption5-c .w { display: inline-block; margin-right: 0.24em; }
    #caption5-c .line .w:last-child { margin-right: 0; }
    /* the source box: a sentence that ends on the outlet's logo, or on its name when there is no logo */
    #caption5-c-src {
      margin-top: 36px; height: 92px; padding: 0 30px; border-radius: 20px; background: var(--box-bg); display: flex; align-items: center;
      box-shadow: var(--box-shadow); transform-origin: left center;
    }
    #caption5-c-srcw {
      font-family: var(--font-body); font-weight: 600; font-size: var(--size-source); line-height: 1; letter-spacing: -0.01em;
      white-space: nowrap; color: var(--box-ink);
    }
    #caption5-c-logo { display: block; width: auto; height: 37.72px; margin-left: 20px; }
  </style>
  <div id="caption5-c" data-composition-id="caption5-c" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "line1", "type": "string", "label": "Claim, first line (the voice words)", "default": "", "maxLength": 24},
      {"id": "line2", "type": "string", "label": "Claim, second line (empty = one line)", "default": "", "maxLength": 24},
      {"id": "at1", "type": "number", "label": "Word 1 lands at (s)", "default": 0.2667, "min": 0, "unit": "s"},
      {"id": "at2", "type": "number", "label": "Word 2 lands at (s, 0 = right after the previous word)", "default": 0.5, "min": 0, "unit": "s"},
      {"id": "at3", "type": "number", "label": "Word 3 lands at (s, 0 = right after the previous word)", "default": 0.7333, "min": 0, "unit": "s"},
      {"id": "at4", "type": "number", "label": "Word 4 lands at (s, 0 = right after the previous word)", "default": 0.9333, "min": 0, "unit": "s"},
      {"id": "at5", "type": "number", "label": "Word 5 lands at (s, 0 = right after the previous word)", "default": 1.0667, "min": 0, "unit": "s"},
      {"id": "source", "type": "string", "label": "Source words before the outlet", "default": "Previewed by", "maxLength": 16},
      {"id": "outlet", "type": "string", "label": "Outlet name (shown as text when there is no logo)", "default": "", "maxLength": 32},
      {"id": "logo", "type": "string", "label": "Outlet logo file (empty = the name as text)", "default": ""},
      {"id": "logo_h", "type": "number", "label": "Logo height", "default": 37.72, "min": 20, "max": 64, "unit": "px"},
      {"id": "logo_trim", "type": "number", "label": "Space taken off after the logo", "default": 0, "min": 0, "max": 24, "unit": "px"},
      {"id": "source_at", "type": "number", "label": "Source box lands at (s)", "default": 1.4, "min": 0.3, "unit": "s"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.3333, "min": 1.8, "unit": "s"}
    ]'>
    <div id="caption5-c-dim"></div>
    <div id="caption5-c-cap" data-layout-allow-overflow>
      <div id="caption5-c-head" data-layout-allow-overflow></div>
      <div id="caption5-c-src"><span id="caption5-c-srcw"></span><img id="caption5-c-logo" alt="" /></div>
    </div>
  </div>
  <script>
    (() => {
      const ID = "caption5-c";
      // this scene's values (declared defaults + the host's values). Read once: the declaration is gone once mounted.
      const V = { theme: "clean", line1: "", line2: "", at1: 0.2667, at2: 0.5, at3: 0.7333, at4: 0.9333, at5: 1.0667,
        source: "Previewed by", outlet: "", logo: "", logo_h: 37.72, logo_trim: 0, source_at: 1.4, out: 4.3333 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#caption5-c, [data-composition-id="caption5-c"]').forEach((el) => el.setAttribute("data-theme", theme));
      const $ = (s) => document.getElementById(ID + s);

      // the claim: up to two lines, one span per word, each word lands on its own time
      const head = $("-head");
      const words = [];
      [V.line1, V.line2].map((l) => String(l || "").trim()).filter(Boolean).forEach((line) => {
        const row = head.appendChild(document.createElement("div"));
        row.className = "line";
        row.setAttribute("data-layout-allow-overflow", "");
        line.split(/\s+/).forEach((w) => {
          const s = document.createElement("span");
          s.className = "w";
          s.textContent = w;
          words.push(row.appendChild(s));
        });
      });
      const SUN = [255, 190, 72], FLAM = [255, 98, 137];
      const mix = (t) => `rgb(${SUN.map((c, i) => Math.round(c + (FLAM[i] - c) * t)).join(",")})`;
      const total = words.reduce((n, w) => n + w.textContent.length, 0) || 1;
      let seen = 0;
      words.forEach((w) => { w.style.setProperty("--g0", mix(seen / total)); seen += w.textContent.length; w.style.setProperty("--g1", mix(seen / total)); });

      // the source: "Previewed by [logo]"; no logo file = the outlet's name as text (a logo is never invented)
      const logo = $("-logo"), hasLogo = !!String(V.logo || "").trim();
      if (hasLogo) {
        $("-srcw").textContent = String(V.source || "");
        logo.src = V.logo;
        logo.alt = String(V.outlet || "");
        logo.style.height = Number(V.logo_h) + "px";
        logo.style.marginRight = -Number(V.logo_trim) + "px";
      } else {
        $("-srcw").textContent = `${V.source || ""} ${V.outlet || ""}`.trim();
        logo.style.display = "none";
      }

      const F = (f) => f / 30;
      const out = Number(V.out);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo($("-dim"), { opacity: 0 }, { opacity: 1, duration: F(12), ease: "power1.out" }, 0);
      // words land with the voice (10 frames each, 16 px rise). A word with no time of its own (or one not after the
      // previous word) lands 6 frames after the previous one.
      let t = -1;
      words.forEach((w, i) => {
        const want = Number(V["at" + (i + 1)]);
        t = i === 0 ? (Number.isFinite(want) ? want : F(8)) : Number.isFinite(want) && want > t ? want : t + F(6);
        tl.fromTo(w, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: F(10), ease: "power3.out" }, t);
      });
      // then the source box, right after the last word
      tl.fromTo($("-src"), { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: F(11), ease: "power3.out" }, Number(V.source_at));
      tl.to([...words, $("-src")], { opacity: 0, y: 8, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.to($("-dim"), { opacity: 0, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(7));
      window.__timelines["caption5-c"] = tl;
    })();
  </script>
</template>
