  <script>
    (() => {
      const R = "phoneapp-a";
      const root = document.getElementById(R);
      // this scene's values (declared defaults + its host's values), read once
      const V = { theme: "clean", line1: "Browse the feed all day,", line2: "but you can't post.", source: "Reported by Game Informer",
        toast: "Posting isn't available", app: "Feed", handle1: "@keys.daily", handle2: "@ocean.nights", handle3: "@shoreline.sam",
        pic1: "", pic2: "", pic3: "", avatar1: "", avatar2: "", avatar3: "", press: 3.467, out: 6.5 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const $ = (s) => document.getElementById(R + "-" + s);
      $("l1").textContent = String(V.line1);
      $("l2").textContent = String(V.line2);
      $("src").textContent = String(V.source || "");
      const hasSrc = !!String(V.source || "").trim();
      if (!hasSrc) $("src").style.display = "none";
      $("toastt").textContent = String(V.toast);
      $("app").textContent = String(V.app);
      // the feed: pictures and account pictures are the project's files; no file = a dark tile / no circle
      const img = (box, file) => {
        const im = document.createElement("img");
        im.alt = "";
        im.src = file;
        box.appendChild(im);
      };
      [1, 2, 3].forEach((i) => {
        $("h" + i).firstChild.nodeValue = String(V["handle" + i]) + " ";
        if (V["pic" + i]) img($("pic" + i), V["pic" + i]);
        if (V["avatar" + i]) img($("av" + i), V["avatar" + i]);
        else { $("av" + i).style.display = "none"; $("who" + i).classList.add("no-av"); }
      });

      const tl = gsap.timeline({ paused: true });
      const F = (f) => f / 30;
      const P = Math.round(Number(V.press) * 30); // the press, in frames (f104 as validated)
      const out = Number(V.out);
      const last = {};
      // every tween starts from the previous value of the same property, so the timeline is seek-safe
      function init(sel, props) {
        for (const k in props) last[sel + "|" + k] = props[k];
        tl.set(sel, props, 0);
      }
      function key(sel, props, atF, durF, ease) {
        const from = {};
        const to = { duration: F(durF), ease: ease || "none", immediateRender: false };
        for (const k in props) {
          const id = sel + "|" + k;
          from[k] = last[id];
          to[k] = props[k];
          last[id] = props[k];
        }
        tl.fromTo(sel, from, to, F(atF));
      }
      const S = (s) => "#" + R + "-" + s;

      // f4: the phone comes in from the right and turns to face us (15 f)
      init(S("phone"), { x: 280, rotationY: -18, opacity: 0, transformOrigin: "100% 50%" });
      key(S("phone"), { opacity: 1 }, 4, 6, "none");
      key(S("phone"), { x: 0, rotationY: 0 }, 4, 15, "expo.out");

      // f12: the app builds inside the screen (header, posts, nav; 3 f apart)
      ["hdr", "p1", "p2", "p3", "nav"].forEach((s, i) => {
        init(S(s), { opacity: 0, y: 14 });
        key(S(s), { opacity: 1, y: 0 }, 12 + i * 3, 12, "power3.out");
      });

      // f22: caption, first half (the lead-in)
      init(S("l1"), { opacity: 0, y: 18 });
      key(S("l1"), { opacity: 1, y: 0 }, 22, 12, "power3.out");

      // f50: a finger lands on the feed and drags it up; it lifts at f70 and the feed coasts on
      init(S("tap"), { x: 240, y: 600, opacity: 0, scale: 0.8 });
      init(S("feed"), { y: 0 });
      key(S("tap"), { opacity: 1, scale: 1 }, 50, 4, "power2.out");
      key(S("tap"), { y: 340 }, 54, 16, "power1.inOut");
      key(S("feed"), { y: -260 }, 54, 16, "power1.inOut");
