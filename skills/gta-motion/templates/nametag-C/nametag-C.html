<template>
  <style>
    /*GTA-THEME*/
    #nametag-c { position: absolute; inset: 0; overflow: hidden; }
    #nametag-c *, #nametag-c *::before, #nametag-c *::after { box-sizing: border-box; margin: 0; }
    #nametag-c[data-theme="clean"] {
      --nc-name-w: 900;
      --nc-name-size: 128px;
      --nc-name-ls: -0.035em;
      --nc-role: #ffffff;
      --nc-role-w: 500;
    }
    #nametag-c[data-theme="vice"] {
      --nc-name-w: 800;
      --nc-name-size: 118px;
      --nc-name-ls: -0.02em;
      --nc-role: var(--pink);
      --nc-role-w: 600;
    }
    /* the shot, full frame at first; it steps back into a straight photo on the right (lands at x 717-1792, y 238-842) */
    #nametag-c-frame {
      position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
      transform-origin: 1629.5px 540px; box-shadow: 0 40px 110px rgba(0, 0, 0, 0.5);
    }
    /* inside the photo the shot pushes in on the face, so the person reads at photo size */
    #nametag-c-push { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    #nametag-c-v { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
    /* name and role are one block, centred on the photo's height; margin 128 px */
    #nametag-c-text { position: absolute; left: 128px; top: 0; }
    #nametag-c-text .ln { height: 110px; overflow: hidden; }
    #nametag-c-text .ln span {
      display: block; color: #ffffff; font-family: var(--font-head); font-weight: var(--nc-name-w); font-size: var(--nc-name-size);
      line-height: 110px; letter-spacing: var(--nc-name-ls); white-space: nowrap; text-transform: uppercase;
    }
    #nametag-c[data-theme="vice"] #nametag-c-text .ln span {
      width: fit-content; color: transparent; background: var(--grad); -webkit-background-clip: text; background-clip: text;
    }
    #nametag-c-role { margin-top: 30px; padding-left: 4px; }
    #nametag-c-role .rl { height: 48px; overflow: hidden; }
    #nametag-c-role .rl span {
      display: block; color: var(--nc-role); font-family: var(--font-body); font-weight: var(--nc-role-w);
      font-size: 36px; line-height: 48px; letter-spacing: -0.01em; white-space: nowrap;
    }
  </style>
  <div id="nametag-c" data-composition-id="nametag-c" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "shot", "type": "string", "label": "The shot that becomes the photo (a clip in assets, as long as the scene)", "default": ""},
      {"id": "name1", "type": "string", "label": "Name, first line (shown in capitals)", "default": "", "maxLength": 7},
      {"id": "name2", "type": "string", "label": "Name, second line (empty = one line)", "default": "", "maxLength": 7},
      {"id": "role1", "type": "string", "label": "Role, first line (empty = no role)", "default": "", "maxLength": 26},
      {"id": "role2", "type": "string", "label": "Role, second line (empty = one line)", "default": "", "maxLength": 26},
      {"id": "faceX", "type": "number", "label": "Face centre x in the shot (the photo pushes in on it)", "default": 1440, "min": 0, "max": 1920, "unit": "px"},
      {"id": "faceY", "type": "number", "label": "Face centre y in the shot", "default": 420, "min": 0, "max": 1080, "unit": "px"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.37, "min": 1.8, "unit": "s"}
    ]'>
    <div id="nametag-c-frame" data-layout-allow-overflow>
      <div id="nametag-c-push">
        <video id="nametag-c-v" class="clip" data-start="0" data-var-src="shot" muted playsinline></video>
      </div>
    </div>
    <div id="nametag-c-text" data-layout-allow-overflow>
      <div class="ln"><span id="nametag-c-n1" data-var-text="name1"></span></div>
      <div class="ln" id="nametag-c-ln2"><span id="nametag-c-n2" data-var-text="name2"></span></div>
      <div id="nametag-c-role">
        <div class="rl"><span id="nametag-c-r1" data-var-text="role1"></span></div>
        <div class="rl" id="nametag-c-rl2"><span id="nametag-c-r2" data-var-text="role2"></span></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const root = document.getElementById("nametag-c");
      const V = { theme: "clean", shot: "", name1: "", name2: "", role1: "", role2: "", faceX: 1440, faceY: 420, out: 4.37 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null && got[k] !== "") V[k] = got[k];
      } catch (e) {}
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const n2 = String(V.name2 || "").trim(), r1 = String(V.role1 || "").trim(), r2 = String(V.role2 || "").trim();
      document.getElementById("nametag-c-n1").textContent = String(V.name1 || "");
      document.getElementById("nametag-c-n2").textContent = n2;
      document.getElementById("nametag-c-r1").textContent = r1;
      document.getElementById("nametag-c-r2").textContent = r2;
      if (!n2) document.getElementById("nametag-c-ln2").style.display = "none";
      if (!r2) document.getElementById("nametag-c-rl2").style.display = "none";
      if (!r1 && !r2) document.getElementById("nametag-c-role").style.display = "none";
      // the push-in is centred on the face (clamped inside the frame, so a rough point still works)
      const fx = Math.min(1820, Math.max(100, Number(V.faceX) || 1440));
      const fy = Math.min(980, Math.max(100, Number(V.faceY) || 420));
      document.getElementById("nametag-c-push").style.transformOrigin = `${fx}px ${fy}px`;

      // a long name never reaches the photo: past 525 px both lines shrink together; then the block is centred on the photo
      const n1El = document.getElementById("nametag-c-n1");
      const layout = () => {
        try {
          const cs = getComputedStyle(n1El);
          const ctx = document.createElement("canvas").getContext("2d");
          ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
          ctx.letterSpacing = cs.letterSpacing;
          const w = Math.max(...[String(V.name1 || ""), n2].map((t) => ctx.measureText(t.toUpperCase()).width));
          const size = parseFloat(cs.fontSize);
          if (w > 525 && size > 0) {
            const px = `${Math.floor((size * 525) / w)}px`;
            n1El.style.fontSize = px;
            document.getElementById("nametag-c-n2").style.fontSize = px;
          }
        } catch (e) {}
        const h = (n2 ? 220 : 110) + (r1 || r2 ? 30 + (r2 ? 96 : 48) : 0);
        document.getElementById("nametag-c-text").style.top = `${Math.round(540 - h / 2)}px`;
      };
      let fontReady = Promise.resolve();
      try {
        const cs = getComputedStyle(n1El);
        fontReady = Promise.all([document.fonts.load(`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`, String(V.name1 || "A").toUpperCase()), document.fonts.ready]);
      } catch (e) {}

      const build = () => {
      layout();
      const F = (f) => f / 30;
      const out = Number(V.out);
      const tl = gsap.timeline({ paused: true });
      // the frame steps back into the page (1 -> 0.56, f17-f32) while the shot inside pushes in on the face, then keeps drifting
      tl.fromTo("#nametag-c-frame", { scale: 1 }, { scale: 0.56, duration: F(15), ease: "power3.inOut" }, F(17));
      tl.fromTo("#nametag-c-push", { scale: 1 }, { scale: 1.2, duration: F(20), ease: "power3.inOut" }, F(17));
      tl.to("#nametag-c-push", { scale: 1.26, duration: Math.max(0.1, out - F(37)), ease: "none" }, F(37));
      // name lines rise out of their masks, then the role lines, 3-4 frames apart
      tl.fromTo("#nametag-c-n1", { yPercent: 102 }, { yPercent: 0, duration: F(14), ease: "expo.out" }, F(24));
      if (n2) tl.fromTo("#nametag-c-n2", { yPercent: 102 }, { yPercent: 0, duration: F(14), ease: "expo.out" }, F(28));
      tl.fromTo("#nametag-c-r1", { yPercent: 105 }, { yPercent: 0, duration: F(12), ease: "expo.out" }, F(n2 ? 32 : 29));
      if (r2) tl.fromTo("#nametag-c-r2", { yPercent: 105 }, { yPercent: 0, duration: F(12), ease: "expo.out" }, F(n2 ? 35 : 32));
      // out: the type drops back into its masks while the photo grows back to full frame (they overlap: no empty beat)
      tl.to(["#nametag-c-n1", "#nametag-c-n2", "#nametag-c-r1", "#nametag-c-r2"], { yPercent: 105, duration: F(6), ease: "power2.in", immediateRender: false }, out);
      tl.to("#nametag-c-frame", { scale: 1, duration: F(10), ease: "power3.inOut", immediateRender: false }, out + F(2));
      tl.to("#nametag-c-push", { scale: 1, duration: F(10), ease: "power3.inOut", immediateRender: false }, out + F(2));
      tl.set({}, {}, out + F(13));
      window.__timelines["nametag-c"] = tl;
      };
      fontReady.then(build, build);
    })();
  </script>
</template>
