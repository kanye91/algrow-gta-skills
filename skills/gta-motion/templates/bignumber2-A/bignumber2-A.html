<template>
  <style>
    /*GTA-THEME*/
    /* Big number, lower third: one striking figure the voice says, over the footage, which stays the subject.
       The source box lands first (caption5-A's, logo and all), then the figure's characters rise one after the other
       through the line they stand on, and the label slides out from behind the figure on the same baseline:
       "170+ animal species" reads as one line. Then everything holds dead still. */
    #bignumber2-a { position: absolute; inset: 0; overflow: hidden; }
    #bignumber2-a *, #bignumber2-a *::before, #bignumber2-a *::after { box-sizing: border-box; margin: 0; }
    #bignumber2-a-stage { position: absolute; inset: 0; }
    /* soft neutral dim behind the lower third, comes and goes with the graphic (caption5-A's, sized for the figure) */
    #bignumber2-a-dim {
      position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(1380px 520px at 600px 900px, rgba(0, 0, 0, 0.46) 0%, rgba(0, 0, 0, 0.447) 10%, rgba(0, 0, 0, 0.412) 20%,
        rgba(0, 0, 0, 0.36) 30%, rgba(0, 0, 0, 0.298) 40%, rgba(0, 0, 0, 0.23) 50%, rgba(0, 0, 0, 0.162) 60%, rgba(0, 0, 0, 0.1) 70%,
        rgba(0, 0, 0, 0.048) 80%, rgba(0, 0, 0, 0.013) 90%, rgba(0, 0, 0, 0) 100%);
    }
    /* the figure's own size, and its cap height in em (Inter 0.727, Sora 0.730): the small signs top-align on it */
    #bignumber2-a { --bn-size: 176px; --bn-small: 0.58; }
    #bignumber2-a[data-theme="clean"] {
      --bn-cap: 0.727; --bn-track: -0.03em; --bn-shadow: 0 4px 24px rgba(0, 0, 0, 0.45); --bn-filter: none;
      --bn-lab-shadow: 0 3px 18px rgba(0, 0, 0, 0.5);
    }
    #bignumber2-a[data-theme="vice"] {
      --bn-cap: 0.730; --bn-track: -0.01em; --bn-shadow: none;
      --bn-filter: drop-shadow(0 0 1.5px rgba(36, 19, 41, 0.95)) drop-shadow(0 5px 0 rgba(36, 19, 41, 0.8)) drop-shadow(0 0 24px rgba(36, 19, 41, 0.6));
      --bn-lab-shadow: none;
    }
    /* one left edge (x 120), the line's baseline on y 958 (inside title-safe) */
    #bignumber2-a .cap { position: absolute; left: 120px; bottom: 96px; display: flex; flex-direction: column; align-items: flex-start; }
    /* the source box: caption5-A's, a sentence that ends on the outlet's logo, or on its name when there is no logo */
    #bignumber2-a .src {
      height: 92px; padding: 0 30px; border-radius: 20px; background: var(--box-bg); display: flex; align-items: center;
      box-shadow: var(--box-shadow); transform-origin: left center; margin-bottom: 14px;
    }
    #bignumber2-a .srcw {
      font-family: var(--font-body); font-weight: 600; font-size: var(--size-source); line-height: 1; letter-spacing: -0.01em;
      white-space: nowrap; color: var(--box-ink);
    }
    #bignumber2-a .src img { display: block; width: auto; height: 37.72px; margin-left: 20px; }
    /* the line: the figure's characters, then the label, on one baseline */
    #bignumber2-a .line { display: flex; align-items: baseline; white-space: nowrap; margin-left: -6px; }
    /* each character stands in its own slot: it rises from below the slot's bottom edge (the slot clips it there) */
    #bignumber2-a .slot { display: inline-block; position: relative; clip-path: inset(-45% -25% -14% -25%); }
    #bignumber2-a .ch {
      display: inline-block; font-family: var(--font-head); font-weight: 800; font-size: var(--bn-size); line-height: 1;
      letter-spacing: var(--bn-track); color: var(--head-fill); text-shadow: var(--bn-shadow); filter: var(--bn-filter);
      font-variant-numeric: tabular-nums;
    }
    /* a currency sign or a plus: smaller, its top on the digits' cap height */
    #bignumber2-a .slot.small { top: calc(-1 * var(--bn-cap) * (1 - var(--bn-small)) * var(--bn-size)); }
    #bignumber2-a .slot.small .ch { font-size: calc(var(--bn-small) * var(--bn-size)); }
    #bignumber2-a .slot.cur { margin-right: 0.04em; }
    #bignumber2-a .slot.plus { margin-left: 0.03em; }
    /* the label: the same baseline, slides out from behind the figure (its slot clips its left side) */
    #bignumber2-a .labslot { display: inline-block; margin-left: 30px; clip-path: inset(-50% -10% -40% 0); }
    #bignumber2-a .lab {
      display: inline-block; font-family: var(--font-body); font-weight: var(--w-body); font-size: 44px; line-height: 1;
      color: var(--text); text-shadow: var(--bn-lab-shadow); filter: var(--bn-filter);
    }
    /* vice: one marigold-to-flamingo ramp across the whole line, each character and the label with its slice (--g0 / --g1) */
    #bignumber2-a[data-theme="vice"] .ch, #bignumber2-a[data-theme="vice"] .lab {
      background-image: linear-gradient(90deg, var(--g0, #ffbe48), var(--g1, #ff6289)); -webkit-background-clip: text;
      background-clip: text; color: transparent;
    }
  </style>
  <div id="bignumber2-a" data-composition-id="bignumber2-a" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "currency", "type": "string", "label": "Currency sign before the figure (empty = none)", "default": "", "maxLength": 2},
      {"id": "figure", "type": "string", "label": "The figure as the voice says it, digits with , or . (975,000)", "default": "170", "maxLength": 9},
      {"id": "unit", "type": "string", "label": "Unit after the figure: M, B, K or % (empty = none)", "default": "", "maxLength": 1},
      {"id": "plus", "type": "boolean", "label": "A plus after the figure (the voice says over or more than)", "default": true},
      {"id": "label", "type": "string", "label": "What the figure counts, on the same line", "default": "animal species", "maxLength": 24},
      {"id": "source", "type": "string", "label": "Source words before the outlet (empty outlet = no source box)", "default": "Confirmed by", "maxLength": 16},
      {"id": "outlet", "type": "string", "label": "Outlet name (shown as text when there is no logo; empty = no source box)", "default": "", "maxLength": 32},
      {"id": "logo", "type": "string", "label": "Outlet logo file (empty = the name as text)", "default": ""},
      {"id": "logo_h", "type": "number", "label": "Logo height", "default": 37.72, "min": 20, "max": 64, "unit": "px"},
      {"id": "logo_trim", "type": "number", "label": "Space taken off after the logo", "default": 0, "min": 0, "max": 24, "unit": "px"},
      {"id": "at", "type": "number", "label": "The figure starts to rise at (s): on its first word", "default": 0.3667, "min": 0.1667, "unit": "s"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.1333, "min": 1.8, "unit": "s"}
    ]'>
    <div id="bignumber2-a-dim"></div>
    <div id="bignumber2-a-stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const ID = "bignumber2-a";
      const V = { theme: "clean", currency: "", figure: "170", unit: "", plus: true, label: "animal species", source: "Confirmed by",
        outlet: "", logo: "", logo_h: 37.72, logo_trim: 0, at: 0.3667, out: 4.1333 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#bignumber2-a, [data-composition-id="bignumber2-a"]').forEach((el) => el.setAttribute("data-theme", theme));
      const stage = document.getElementById(ID + "-stage");
      const el = (tag, cls, parent) => { const d = document.createElement(tag); if (cls) d.className = cls; parent.appendChild(d); return d; };

      // the figure as one string: currency + digits + unit + plus. Leading currency signs and the plus are set small
      const cur = String(V.currency || "").trim(), fig = String(V.figure || "").trim().replace(/\s+/g, "");
      const unit = String(V.unit || "").trim(), plus = V.plus === true || V.plus === "true";
      const chars = [...[...cur].map((c) => ({ c, kind: "cur" })), ...[...fig].map((c) => ({ c, kind: "" })),
        ...[...unit].map((c) => ({ c, kind: "" })), ...(plus ? [{ c: "+", kind: "plus" }] : [])];

      const cap = el("div", "cap", stage);
      // the source box: shown when there is an outlet (or a logo); no logo file = the outlet's name as text
      const outlet = String(V.outlet || "").trim(), hasLogo = !!String(V.logo || "").trim();
      let src = null;
      if (outlet || hasLogo) {
        src = el("div", "src", cap);
        const w = el("span", "srcw", src);
        if (hasLogo) {
          w.textContent = String(V.source || "");
          const img = el("img", "", src);
          img.src = V.logo;
          img.alt = outlet;
          img.style.height = Number(V.logo_h) + "px";
          img.style.marginRight = -Number(V.logo_trim) + "px";
        } else w.textContent = `${V.source || ""} ${outlet}`.trim();
      }
      const line = el("div", "line", cap);
      const slots = chars.map(({ c, kind }) => {
        const s = el("span", "slot" + (kind ? " small " + kind : ""), line);
        const ch = el("span", "ch", s);
        ch.textContent = c;
        return { s, ch, small: !!kind };
      });
      const label = String(V.label || "").trim();
      let labslot = null, lab = null;
      if (label) {
        labslot = el("span", "labslot", line);
        lab = el("span", "lab", labslot);
        lab.textContent = label;
      }

      // vice: one ramp across the line, each part with its slice, weighted by its rough width on screen
      const SUN = [255, 190, 72], FLAM = [255, 98, 137];
      const mix = (t) => `rgb(${SUN.map((c, i) => Math.round(c + (FLAM[i] - c) * t)).join(",")})`;
      const parts = [...slots.map((x) => ({ node: x.ch, w: x.small ? 0.33 : 0.58 })), ...(lab ? [{ node: lab, w: label.length * 0.135 }] : [])];
      const total = parts.reduce((n, p) => n + p.w, 0) || 1;
      let seen = 0;
      parts.forEach((p) => { p.node.style.setProperty("--g0", mix(seen / total)); seen += p.w; p.node.style.setProperty("--g1", mix(seen / total)); });

      const F = (f) => f / 30;
      const at = Number(V.at), out = Number(V.out);
      const n = slots.length;
      const step = n > 1 ? Math.min(F(1.5), F(8) / (n - 1)) : 0;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#bignumber2-a-dim", { opacity: 0 }, { opacity: 1, duration: F(12), ease: "power1.out" }, 0);
      // in: the source box leads (caption5-A: fade + 16 px rise + a hair of scale, 11 frames), 5 frames before the figure
      if (src) tl.fromTo(src, { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: F(11), ease: "power3.out" }, Math.max(0, at - F(5)));
      // each character rises through its slot's bottom edge, one after the other (12 frames each)
      slots.forEach((x, i) => {
        tl.fromTo(x.ch, { yPercent: 118 }, { yPercent: 0, duration: F(12), ease: "power3.out" }, at + i * step);
        tl.set(x.s, { clipPath: "none" }, at + i * step + F(12));
      });
      // the label slides out from behind the figure as the last character lands
      const labAt = at + Math.max(0, n - 1) * step + F(4);
      if (lab) {
        tl.fromTo(lab, { xPercent: -102 }, { xPercent: 0, duration: F(12), ease: "power3.out" }, labAt);
        tl.set(labslot, { clipPath: "none" }, labAt + F(12));
      }
      // out: together, 7 frames; the dim goes with them
      tl.to(cap, { opacity: 0, y: 8, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.to("#bignumber2-a-dim", { opacity: 0, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(7));
      window.__timelines["bignumber2-a"] = tl;
    })();
  </script>
</template>
