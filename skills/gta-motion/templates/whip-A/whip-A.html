<template>
  <style>
    /*GTA-THEME*/
    /* Whip pan, horizontal: both shots ride one strip that slides a frame-width to the left in 7 frames
       through a heavy motion blur (the seam blurs too, so it reads as one camera move), then B is sharp at once.
       The seam crosses the centre on frame 3.
       The motion blur is footage blur, so the move is baked with ffmpeg (device.json "recipe") from the project's
       own two shots. This scene only plays that baked window over the project's own hard cut. Its file is always
       assets/transitions/SCENE_ID.mp4, a path make_scene writes when it renames the scene. */
    #whip-a { position: absolute; inset: 0; overflow: hidden; }
    #whip-a-win { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  </style>
  <div id="whip-a" data-composition-id="whip-a" data-width="1920" data-height="1080"
    data-composition-variables='[]'>
    <video id="whip-a-win" class="clip" src="assets/transitions/whip-a.mp4" muted playsinline data-start="0" data-duration="0.2333"></video>
  </div>
  <script>
    (() => {
      // nothing to build: the 7 frames live in the baked file. The timeline only holds the scene for them.
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 7 / 30);
      window.__timelines["whip-a"] = tl;
    })();
  </script>
</template>
