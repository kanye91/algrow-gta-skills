<template>
  <style>
    /*GTA-THEME*/
    /* Game switch, year roll: the way into another game's footage (or back to GTA VI). Two halves of a plate in the
       ground colours close over the project's own hard cut; the year rolls back (2026 to 2004) like a counter, the
       incoming game's logo lands under it, then the halves open on the new game's footage. Coming back to GTA VI, the
       year rolls forward. */
    #gameswitch-c { position: absolute; inset: 0; overflow: hidden; }
    #gameswitch-c[data-theme="clean"] {
      --gs-plate: radial-gradient(ellipse 60% 56% at 26% 12%, rgba(255, 190, 72, 0.32) 0%, rgba(255, 190, 72, 0.1) 45%, rgba(255, 190, 72, 0) 72%),
        linear-gradient(168deg, #ec4e7c 0%, #d53f5f 55%, #b3324d 100%);
      --gs-year: #FFFFFF; --gs-year-shadow: 0 8px 36px rgba(60, 10, 30, 0.45);
    }
    #gameswitch-c[data-theme="vice"] {
      --gs-plate: radial-gradient(ellipse 62% 52% at 22% 6%, rgba(255, 236, 200, 0.4) 0%, rgba(255, 236, 200, 0) 70%),
        linear-gradient(168deg, #ffbe48 0%, #ff8a6a 44%, #ff6289 80%, #ef507f 100%);
      --gs-year: #241329; --gs-year-shadow: none;
    }
    /* each half holds the whole plate, clipped to its half, so the gradient runs across the seam unbroken */
    #gameswitch-c .gs-half { position: absolute; left: 0; width: 1920px; height: 540px; overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.35); }
    #gameswitch-c-top { top: 0; }
    #gameswitch-c-bot { top: 540px; }
    #gameswitch-c .gs-plate { position: absolute; left: 0; width: 1920px; height: 1080px; background: var(--gs-plate); }
    #gameswitch-c-top .gs-plate { top: 0; }
    #gameswitch-c-bot .gs-plate { top: -540px; }
    #gameswitch-c .gs-face { position: absolute; left: 0; width: 1920px; height: 1080px; }
    #gameswitch-c-top .gs-face { top: 0; }
    #gameswitch-c-bot .gs-face { top: -540px; }
    #gameswitch-c .gs-year { position: absolute; left: 0; top: 214px; width: 1920px; display: flex; justify-content: center; }
    #gameswitch-c .gs-col { height: 260px; overflow: hidden; }
    #gameswitch-c .gs-strip { display: flex; flex-direction: column; }
    #gameswitch-c .gs-digit { height: 260px; width: 150px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-head); font-weight: var(--w-head); font-size: 250px; line-height: 1; color: var(--gs-year);
      text-shadow: var(--gs-year-shadow); font-variant-numeric: tabular-nums; }
    #gameswitch-c .gs-logo { position: absolute; left: 0; top: 520px; width: 1920px; display: flex; justify-content: center; }
    #gameswitch-c .gs-logo img { display: block; height: auto; filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.4)); }
  </style>
  <div id="gameswitch-c" data-composition-id="gameswitch-c" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "game", "type": "string", "label": "The incoming game (the logo alt text)", "default": "", "maxLength": 40},
      {"id": "logo", "type": "string", "label": "The incoming game logo file (transparent PNG)", "default": ""},
      {"id": "from", "type": "string", "label": "The year it rolls from (the outgoing game)", "default": "2026", "maxLength": 4},
      {"id": "year", "type": "string", "label": "The year it rolls to (the incoming game)", "default": "2004", "maxLength": 4},
      {"id": "width", "type": "number", "label": "Logo width", "default": 560, "min": 360, "max": 800, "unit": "px"},
      {"id": "cut", "type": "number", "label": "The hard cut under the plate at (s)", "default": 0.4, "min": 0.4, "unit": "s"},
      {"id": "out", "type": "number", "label": "The plate opens at (s)", "default": 1.6, "min": 1.35, "unit": "s"}
    ]'>
    <div id="gameswitch-c-top" class="gs-half"><div class="gs-plate"></div><div class="gs-face"></div></div>
    <div id="gameswitch-c-bot" class="gs-half"><div class="gs-plate"></div><div class="gs-face"></div></div>
  </div>
  <script>
    (() => {
      const V = { theme: "clean", game: "", logo: "", from: "2026", year: "2004", width: 560, cut: 0.4, out: 1.6 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#gameswitch-c, [data-composition-id="gameswitch-c"]').forEach((el) => el.setAttribute("data-theme", theme));
      const from = String(V.from || "2026").replace(/\D/g, "").padStart(4, "0").slice(-4);
      const to = String(V.year || "2004").replace(/\D/g, "").padStart(4, "0").slice(-4);
      const back = Number(to) < Number(from);   // rolling back in time: the digits run down; forward: up
      // the face (year + logo) is drawn twice, once in each half, so it splits cleanly when the halves open
      const strips = [];
      for (const half of ["top", "bot"]) {
        const face = document.querySelector(`#gameswitch-c-${half} .gs-face`);
        const row = document.createElement("div");
        row.className = "gs-year";
        for (let i = 0; i < 4; i++) {
          const a = Number(from[i]), b = Number(to[i]);
          // a digit that changes runs through the digits between (plus a full turn on the last one, for the roll)
          const steps = a === b ? 0 : (back ? (a - b + 10) % 10 : (b - a + 10) % 10) + (i === 3 ? 10 : 0);
          const col = document.createElement("div");
          col.className = "gs-col";
          const strip = document.createElement("div");
          strip.className = "gs-strip";
          for (let k = 0; k <= steps; k++) {
            const d = document.createElement("div");
            d.className = "gs-digit";
            d.textContent = String((back ? a - k + 100 : a + k) % 10);
            strip.appendChild(d);
          }
          col.appendChild(strip);
          row.appendChild(col);
          strips.push({ strip, steps, i });
        }
        face.appendChild(row);
        const lb = document.createElement("div");
        lb.className = "gs-logo";
        const img = document.createElement("img");
        img.alt = String(V.game || "");
        if (String(V.logo || "").trim()) img.src = V.logo;
        img.style.width = `${Math.round(Number(V.width) || 560)}px`;
        lb.appendChild(img);
        face.appendChild(lb);
      }

      const F = (f) => f / 30;
      const cut = Math.max(0.4, Number(V.cut) || 0.4), out = Number(V.out) || 1.6;
      const t0 = cut - F(11);   // the halves take 11 frames and meet on the cut
      const tl = gsap.timeline({ paused: true });
      tl.set("#gameswitch-c-top", { y: -560 }, 0);
      tl.set("#gameswitch-c-bot", { y: 560 }, 0);
      // in: the two halves close on the centre line (11 frames), shut on the cut; the old year shows on them
      tl.to("#gameswitch-c-top", { y: 0, duration: F(11), ease: "expo.out" }, t0);
      tl.to("#gameswitch-c-bot", { y: 0, duration: F(11), ease: "expo.out" }, t0);
      // the year rolls to the new one (the last digit 18 frames, the others a little sooner)
      for (const s of strips) {
        if (!s.steps) continue;
        tl.fromTo(s.strip, { y: 0 }, { y: -260 * s.steps, duration: F(s.i === 3 ? 18 : 14), ease: "power3.inOut" }, cut + F(1));
      }
      // the logo lands under it (12 frames, a hair of scale), in both halves at once
      tl.fromTo("#gameswitch-c .gs-logo img", { scale: 1.1, opacity: 0 }, { scale: 1, opacity: 1, duration: F(12), ease: "expo.out" }, cut + F(12));
      // out: the halves open, top up and bottom down (10 frames), onto the new footage
      tl.to("#gameswitch-c-top", { y: -560, duration: F(10), ease: "expo.in", immediateRender: false }, out);
      tl.to("#gameswitch-c-bot", { y: 560, duration: F(10), ease: "expo.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(10));
      window.__timelines["gameswitch-c"] = tl;
    })();
  </script>
</template>
