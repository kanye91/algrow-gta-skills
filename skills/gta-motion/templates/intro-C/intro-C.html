<template>
  <style>
    /*GTA-THEME*/
    /* Intro, letterbox open: the video opens on its first shot with two cinema bars in the ground colours closing in
       (2.39:1), the game's logo landing over the shot and an optional line in the bottom bar; then the logo lifts away
       and the bars open the frame to full 16:9. */
    #intro-c { position: absolute; inset: 0; overflow: hidden; }
    #intro-c[data-theme="clean"] {
      --ic-plate:
        radial-gradient(ellipse 60% 56% at 26% 12%, rgba(255, 190, 72, 0.6) 0%, rgba(255, 150, 90, 0.22) 45%, rgba(255, 150, 90, 0) 72%),
        radial-gradient(ellipse 55% 50% at 88% 94%, rgba(255, 98, 137, 0.32) 0%, rgba(255, 98, 137, 0) 70%),
        linear-gradient(160deg, #ec4e7c 0%, #d53f5f 52%, #b3324d 100%);
      --ic-title: #FFFFFF; --ic-title-shadow: 0 4px 18px rgba(60, 10, 30, 0.4); --ic-shade: 0, 0, 0;
    }
    #intro-c[data-theme="vice"] {
      --ic-plate:
        radial-gradient(ellipse 62% 52% at 22% 6%, rgba(255, 222, 140, 0.6) 0%, rgba(255, 222, 140, 0) 70%),
        linear-gradient(168deg, #ffbe48 0%, #ff8a6a 44%, #ff6289 80%, #ef507f 100%);
      --ic-title: #241329; --ic-title-shadow: none; --ic-shade: 36, 19, 41;
    }
    /* the two bars cut one ground in two: each shows its own slice of the full-frame gradient */
    #intro-c .bar { position: absolute; left: 0; width: 1920px; height: 139px; overflow: hidden; }
    #intro-c .bar .pl { position: absolute; left: 0; width: 1920px; height: 1080px; background: var(--ic-plate); }
    #intro-c-top { top: 0; }
    #intro-c-top .pl { top: 0; }
    #intro-c-bot { top: 941px; }
    #intro-c-bot .pl { top: -941px; }
    /* a soft shade behind the logo so it reads on any shot (a gradient, never a flat tint) */
    #intro-c-shade { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(1100px 620px at 960px 520px, rgba(var(--ic-shade), 0.42) 0%, rgba(var(--ic-shade), 0.26) 40%,
        rgba(var(--ic-shade), 0.08) 75%, rgba(var(--ic-shade), 0) 100%); }
    #intro-c-mid { position: absolute; left: 0; top: 139px; width: 1920px; height: 802px; display: flex; align-items: center; justify-content: center; }
    #intro-c-logo { display: block; height: auto; filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.55)); }
    #intro-c-title { position: absolute; left: 0; top: 0; width: 1920px; height: 139px; text-align: center; white-space: nowrap;
      font-family: var(--font-head); font-weight: var(--w-head); font-size: 50px; line-height: 139px;
      color: var(--ic-title); text-shadow: var(--ic-title-shadow); }
  </style>
  <div id="intro-c" data-composition-id="intro-c" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "game", "type": "string", "label": "The game (the logo alt text)", "default": "Grand Theft Auto VI", "maxLength": 40},
      {"id": "logo", "type": "string", "label": "The game logo file (transparent PNG)", "default": ""},
      {"id": "title", "type": "string", "label": "Optional line in the bottom bar (empty = none)", "default": "", "maxLength": 44},
      {"id": "width", "type": "number", "label": "Logo width", "default": 560, "min": 380, "max": 760, "unit": "px"},
      {"id": "at", "type": "number", "label": "The logo lands at (s)", "default": 0.3, "min": 0.1, "unit": "s"},
      {"id": "out", "type": "number", "label": "The frame opens at (s)", "default": 2.6, "min": 1.2, "unit": "s"}
    ]'>
    <div id="intro-c-shade"></div>
    <div id="intro-c-mid" data-layout-allow-overflow></div>
    <div id="intro-c-top" class="bar"><div class="pl"></div></div>
    <div id="intro-c-bot" class="bar"><div class="pl"></div></div>
  </div>
  <script>
    (() => {
      const V = { theme: "clean", game: "Grand Theft Auto VI", logo: "", title: "", width: 560, at: 0.3, out: 2.6 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#intro-c, [data-composition-id="intro-c"]').forEach((el) => el.setAttribute("data-theme", theme));
      const mid = document.getElementById("intro-c-mid");
      const logo = document.createElement("img");
      logo.id = "intro-c-logo";
      logo.alt = String(V.game || "");
      if (String(V.logo || "").trim()) logo.src = V.logo;
      logo.style.width = Math.round(Number(V.width) || 560) + "px";
      mid.appendChild(logo);
      const ttl = String(V.title || "").trim();
      let title = null;
      if (ttl) {
        title = document.createElement("div");
        title.id = "intro-c-title";
        title.textContent = ttl;
        document.getElementById("intro-c-bot").appendChild(title);
      }

      const F = (f) => f / 30;
      const at = Number(V.at) || 0.3, out = Number(V.out) || 2.6;
      const tl = gsap.timeline({ paused: true });
      // in: the bars close in from the edges (10 frames), the shade comes up under where the logo will land
      tl.fromTo("#intro-c-top", { y: -139 }, { y: 0, duration: F(10), ease: "expo.out" }, 0);
      tl.fromTo("#intro-c-bot", { y: 139 }, { y: 0, duration: F(10), ease: "expo.out" }, 0);
      tl.fromTo("#intro-c-shade", { opacity: 0 }, { opacity: 1, duration: F(12), ease: "power1.out" }, Math.max(0, at - F(4)));
      // the logo lands with a short drop and a hair of scale (13 frames), opaque after 6
      tl.fromTo(logo, { y: -26, scale: 1.08, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: F(13), ease: "expo.out" }, at);
      if (title) tl.fromTo(title, { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: F(12), ease: "power3.out" }, at + F(8));
      // out: the logo lifts away (8 frames), the shade goes, the bars open the frame (9 frames, the line leaves with its bar)
      tl.to(logo, { y: -34, opacity: 0, duration: F(8), ease: "power2.in" }, out);
      tl.to("#intro-c-shade", { opacity: 0, duration: F(9), ease: "power1.in" }, out);
      tl.to("#intro-c-top", { y: -139, duration: F(9), ease: "power3.in" }, out + F(1));
      tl.to("#intro-c-bot", { y: 139, duration: F(9), ease: "power3.in" }, out + F(1));
      tl.set({}, {}, out + F(10));
      window.__timelines["intro-c"] = tl;
    })();
  </script>
</template>
