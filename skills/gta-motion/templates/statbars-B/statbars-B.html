<template>
  <style>

    /* soft neutral dim behind the meters, comes and goes with the graphic (was baked into the lab clip) */

    /* the validated values of this variant (lab sbb.html) */

      --sm-body-w: 500;

      --sm-ink2: rgba(255, 255, 255, 0.8);
      --sm-track: rgba(255, 255, 255, 0.2);
      --sm-fill: #ffffff;
      --sm-ghost: rgba(255, 255, 255, 0.42);

    #statbars-b[data-theme="vice"] {

    /* label left, value right, a thin track: no HUD frame, no icons, no plate */
    #statbars-b-meters { position: absolute; left: 1160px; top: 772px; width: 640px; height: 220px; }
    #statbars-b .m { position: absolute; left: 0; width: 640px; height: 90px; }
    #statbars-b-m1 { top: 0; }

    #statbars-b .lab {

    #statbars-b .val {
      position: absolute; right: 0; top: -4px; font-family: var(--font-head); color: var(--sm-ink); font-weight: 800;

  </style>
  <div id="statbars-b" data-composition-id="statbars-b" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "label1", "type": "string", "label": "Meter 1 name", "default": "Muscle", "maxLength": 20},
      {"id": "from1", "type": "number", "label": "Meter 1 value at the start", "default": 62, "min": 0},
      {"id": "value1", "type": "number", "label": "Meter 1 value at the end", "default": 68, "min": 0},
      {"id": "at1", "type": "number", "label": "Meter 1 starts to change at (s)", "default": 3.133, "min": 0.6, "unit": "s"},
      {"id": "for1", "type": "number", "label": "Meter 1 change lasts (s)", "default": 0.6, "min": 0.1, "unit": "s"},
      {"id": "label2", "type": "string", "label": "Meter 2 name", "default": "Stamina", "maxLength": 20},
      {"id": "from2", "type": "number", "label": "Meter 2 value at the start", "default": 100, "min": 0},
      {"id": "value2", "type": "number", "label": "Meter 2 value at the end", "default": 71, "min": 0},
      {"id": "at2", "type": "number", "label": "Meter 2 starts to change at (s)", "default": 0.733, "min": 0.6, "unit": "s"},
      {"id": "for2", "type": "number", "label": "Meter 2 change lasts (s)", "default": 3.4, "min": 0.1, "unit": "s"},
      {"id": "max", "type": "number", "label": "A full meter is worth", "default": 100, "min": 1},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.267, "min": 1.0, "unit": "s"}
    ]'>
    <div id="statbars-b-dim"></div>
    <div id="statbars-b-meters">
      <div id="statbars-b-m1" class="m">
        <div id="statbars-b-l1" class="lab" data-var-text="label1">Muscle</div><div id="statbars-b-v1" class="val">62</div>
        <div class="track"><div id="statbars-b-g1" class="ghost"></div><div id="statbars-b-f1" class="fill"></div></div>
      </div>
      <div id="statbars-b-m2" class="m">
        <div id="statbars-b-l2" class="lab" data-var-text="label2">Stamina</div><div id="statbars-b-v2" class="val">100</div>
        <div class="track"><div id="statbars-b-g2" class="ghost"></div><div id="statbars-b-f2" class="fill"></div></div>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const R = "statbars-b";
      const root = document.getElementById(R);
      // this scene's values (declared defaults + its host's values), read once
      const V = { theme: "clean", label1: "Muscle", from1: 62, value1: 68, at1: 3.133, for1: 0.6,
        label2: "Stamina", from2: 100, value2: 71, at2: 0.733, for2: 3.4, max: 100, out: 4.267 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const $ = (s) => document.getElementById(R + "-" + s);
      $("l1").textContent = String(V.label1);
      $("l2").textContent = String(V.label2);

      const f = (n) => n / 30;
      const W = 640;
      const out = Number(V.out);
      const MAX = Math.max(Number(V.max), V.from1, V.value1, V.from2, V.value2);
      const clamp = (x) => Math.min(1, Math.max(0, x));
      const seg = (t, a, d, e) => gsap.parseEase(e)(clamp((t - a) / d));
      // a gain: the ghost jumps ahead first (6 f, the gain to come), then the fill catches up.
      // a loss: the fill drains and a lighter ghost trails 12 f behind, so the cost stays visible.
      const meter = (i) => {
        const a = Number(V["from" + i]), b = Number(V["value" + i]), at = Number(V["at" + i]), d = Math.max(0.01, Number(V["for" + i]));
        if (b >= a) return {
          fill: (t) => a + (b - a) * seg(t, at + f(6), d, "power3.out"),
          ghost: (t) => a + (b - a) * seg(t, at, f(6), "power2.out"),
        };
        const fill = (t) => a + (b - a) * seg(t, at, d, "power1.inOut");
        return { fill, ghost: (t) => fill(t - f(12)) };
      };
      const M = [meter(1), meter(2)];
      const set = (el, v) => { el.style.clipPath = `inset(0 ${(W - (v / MAX) * W).toFixed(2)}px 0 0 round 7px)`; };
      const clock = { t: 0 };
      const render = () => {
        const t = clock.t;
        M.forEach((m, k) => {
          set($("f" + (k + 1)), m.fill(t));
          set($("g" + (k + 1)), m.ghost(t));
          $("v" + (k + 1)).textContent = Math.round(m.fill(t));
        });
      };
      const END = out + f(7);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: render }, 0);
      tl.fromTo($("dim"), { opacity: 0 }, { opacity: 1, duration: f(12), ease: "power1.out" }, 0);
      tl.fromTo([$("m1"), $("m2")], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: f(12), ease: "power3.out", stagger: f(3) }, f(6));
      tl.fromTo([$("m1"), $("m2")], { opacity: 1, y: 0 }, { opacity: 0, y: 8, duration: f(7), ease: "power2.in", immediateRender: false }, out);
      tl.fromTo($("dim"), { opacity: 1 }, { opacity: 0, duration: f(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, END);
      window.__timelines["statbars-b"] = tl;
      render();
    })();
  </script>
</template>
