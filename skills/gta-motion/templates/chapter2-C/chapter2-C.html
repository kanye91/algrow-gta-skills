      tl.fromTo(P + "card", { clipPath: poly(2300) }, { clipPath: poly(-12), duration: WIPE, ease: "power2.inOut" }, IN);
      tl.fromTo(P + "slash", { x: slashX(2300), skewX: 15, opacity: 1 }, { x: slashX(-12), duration: WIPE, ease: "power2.inOut" }, IN);
      tl.set(P + "slash", { opacity: 0 }, IN + WIPE);
      tl.fromTo(P + "ground", { x: 150 }, { x: 0, duration: 1.8, ease: "expo.out" }, IN);

      // the window rises into place, then (at `out`) grows round its focus point until the shot fills the frame; sampled per frame
      const DT = 1 / 30, RISE = 800, RD = 0.5, R0 = IN + 0.1, KEND = 20;
      const expoOut = gsap.parseEase("expo.out"), p3in = gsap.parseEase("power3.in");
      const clamp01 = (v) => Math.min(1, Math.max(0, v));
      const dAt = (t) => RISE * (1 - expoOut(clamp01((t - R0) / RD)));
      const kAt = (t) => 1 + (KEND - 1) * p3in(clamp01((t - ZOOM) / ZD));
      const shape = (t) => numeral(dAt(t), kAt(t));
      const sampled = (t0, t1) => {
        const m = Math.round((t1 - t0) / DT);
        for (let j = 0; j < m; j++) {
          const a = t0 + j * DT, b = t0 + (j + 1) * DT;
          tl.fromTo(P + "winclip", { clipPath: shape(a) }, { clipPath: shape(b), duration: DT, ease: "none", immediateRender: j === 0 && t0 === R0 }, a);
        }
      };
      tl.set(P + "winclip", { clipPath: shape(0) }, 0);
      tl.set(P + "winscale", { x: -440 }, 0);
      sampled(R0, R0 + RD + DT);

      tl.fromTo(P + "kicker span", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out", stagger: 0.05 }, IN + 0.28);
      tl.fromTo(P + "title span.rp", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out", stagger: 0.07 }, IN + 0.36);
      tl.fromTo(P + "toc span", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out", stagger: 0.03 }, IN + 0.55);

      tl.set(P + "win", { clipPath: "inset(0px 0px 0px 0px)" }, ZOOM);
      tl.to([P + "txt", P + "toc"], { opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power2.in" }, ZOOM);
      sampled(ZOOM, ZOOM + ZD);
      tl.set(P + "winclip", { clipPath: "none" }, ZOOM + ZD);
      tl.to(P + "winscale", { x: 0, duration: ZD - 0.1, ease: "power2.inOut" }, ZOOM);
      tl.to(P + "winscale", { scale: 1.06, duration: ZD, ease: "power2.in" }, ZOOM);
      tl.to(P + "ground", { scale: 2.2, duration: ZD, ease: "power3.in" }, ZOOM);
      tl.set({}, {}, END);
      window.__timelines["chapter2-c"] = tl;
    })();
  </script>
