<template>
  <style>
    /*GTA-THEME*/
    /* Map size, side by side: two real maps cut out of their sea, at the same scale (their heights in km set it),
       standing on one baseline with their names under them; the claim above. Full screen over the levelled blur. */
    #mapsize-a { position: absolute; inset: 0; overflow: hidden; font-family: var(--font-body); }
    #mapsize-a *, #mapsize-a *::before, #mapsize-a *::after { box-sizing: border-box; margin: 0; }
    #mapsize-a[data-theme="clean"] {
      --ms-ink: #ffffff; --ms-sub: #ffffff; --ms-hw: 800; --ms-hls: -0.03em; --ms-bw: 500;
      --ms-tsh: 0 4px 24px rgba(0, 0, 0, 0.45); --ms-shade: 0, 0, 0;
    }
    #mapsize-a[data-theme="vice"] {
      --ms-ink: var(--sun); --ms-sub: var(--pink); --ms-hw: 800; --ms-hls: -0.02em; --ms-bw: 600;
      --ms-tsh: 0 4px 24px rgba(36, 19, 41, 0.6); --ms-shade: 36, 19, 41;
    }
    #mapsize-a-dim { position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(ellipse 70% 70% at 50% 58%, rgba(var(--ms-shade), 0.18) 0%, rgba(var(--ms-shade), 0.5) 100%); }
    #mapsize-a-top { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
    #mapsize-a-heads { position: relative; height: 80px; }
    #mapsize-a .head { position: absolute; left: 0; right: 0; top: 0; color: var(--ms-ink); font-family: var(--font-head);
      font-weight: var(--ms-hw); font-size: 72px; line-height: 80px; letter-spacing: var(--ms-hls); white-space: nowrap; text-shadow: var(--ms-tsh); opacity: 0; }
    #mapsize-a-src { margin-top: 16px; color: var(--ms-sub); font-weight: var(--ms-bw); font-size: 32px; line-height: 40px;
      white-space: nowrap; text-shadow: var(--ms-tsh); opacity: 0; }
    /* the two maps on one baseline; the gap between them is fixed, the row is centred */
    #mapsize-a-row { position: absolute; left: 0; right: 0; top: 236px; height: 760px; display: flex; justify-content: center;
      align-items: flex-end; gap: 190px; }
    #mapsize-a .col { display: flex; flex-direction: column; align-items: center; opacity: 0; }
    #mapsize-a .map { display: block; width: auto; filter: drop-shadow(0 22px 34px rgba(0, 0, 0, 0.55)); }
    #mapsize-a .lab { margin-top: 24px; text-align: center; white-space: nowrap; }
    #mapsize-a .lab b { display: block; color: var(--ms-ink); font-family: var(--font-head); font-weight: var(--ms-hw); font-size: 46px;
      line-height: 50px; letter-spacing: var(--ms-hls); text-shadow: var(--ms-tsh); }
    #mapsize-a .lab span { display: block; margin-top: 6px; color: var(--ms-sub); font-weight: var(--ms-bw); font-size: 26px; line-height: 32px;
      text-shadow: var(--ms-tsh); }
    #mapsize-a-credit { position: absolute; right: 56px; bottom: 30px; color: #ffffff; font-size: 18px; line-height: 22px;
      font-weight: 500; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6); opacity: 0; white-space: nowrap; }
  </style>
  <div id="mapsize-a" data-composition-id="mapsize-a" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "head", "type": "string", "label": "The claim, in capitals", "default": "", "maxLength": 32},
      {"id": "head2", "type": "string", "label": "A second claim that replaces it (empty = none)", "default": "", "maxLength": 32},
      {"id": "source", "type": "string", "label": "Source line (empty = none)", "default": "", "maxLength": 44},
      {"id": "map1", "type": "string", "label": "Left map: a land cut-out PNG (transparent sea)", "default": ""},
      {"id": "km1", "type": "number", "label": "Left map: height of the image in km", "default": 11.04},
      {"id": "label1", "type": "string", "label": "Left map: its game", "default": "", "maxLength": 12},
      {"id": "sub1", "type": "string", "label": "Left map: the line under it (empty = none)", "default": "", "maxLength": 24},
      {"id": "map2", "type": "string", "label": "Right map: a land cut-out PNG (transparent sea)", "default": ""},
      {"id": "km2", "type": "number", "label": "Right map: height of the image in km", "default": 17.12},
      {"id": "label2", "type": "string", "label": "Right map: its game", "default": "", "maxLength": 12},
      {"id": "sub2", "type": "string", "label": "Right map: the line under it (empty = none)", "default": "", "maxLength": 24},
      {"id": "credit", "type": "string", "label": "Credit for a map that needs one, bottom right (empty = none)", "default": "", "maxLength": 80},
      {"id": "at1", "type": "number", "label": "Left map lands at (s)", "default": 2.4, "unit": "s"},
      {"id": "at2", "type": "number", "label": "Right map lands at (s)", "default": 0.6, "unit": "s"},
      {"id": "head_at", "type": "number", "label": "Claim lands at (s)", "default": 1.6, "unit": "s"},
      {"id": "head2_at", "type": "number", "label": "Second claim lands at (s)", "default": 4.6, "unit": "s"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 7.5, "unit": "s"}
    ]'>
    <div id="mapsize-a-dim"></div>
    <div id="mapsize-a-top">
      <div id="mapsize-a-heads">
        <div id="mapsize-a-head" class="head" data-var-text="head"></div>
        <div id="mapsize-a-head2" class="head" data-var-text="head2"></div>
      </div>
      <div id="mapsize-a-src" data-var-text="source"></div>
    </div>
    <div id="mapsize-a-row" data-layout-allow-overflow>
      <div id="mapsize-a-c1" class="col">
        <img id="mapsize-a-m1" class="map" data-var-src="map1" alt="" />
        <div class="lab"><b id="mapsize-a-l1" data-var-text="label1"></b><span id="mapsize-a-s1" data-var-text="sub1"></span></div>
      </div>
      <div id="mapsize-a-c2" class="col">
        <img id="mapsize-a-m2" class="map" data-var-src="map2" alt="" />
        <div class="lab"><b id="mapsize-a-l2" data-var-text="label2"></b><span id="mapsize-a-s2" data-var-text="sub2"></span></div>
      </div>
    </div>
    <div id="mapsize-a-credit" data-var-text="credit"></div>
  </div>
  <script>
    (() => {
      const V = { theme: "clean", head: "", head2: "", source: "", map1: "", km1: 11.04, label1: "", sub1: "", map2: "", km2: 17.12, label2: "",
        sub2: "", credit: "", at1: 2.4, at2: 0.6, head_at: 1.6, head2_at: 4.6, out: 7.5 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const root = document.getElementById("mapsize-a");
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const $ = (id) => document.getElementById(`mapsize-a-${id}`);
      const str = (v) => String(v == null ? "" : v).trim();
      for (const k of ["head", "head2", "source", "label1", "sub1", "label2", "sub2", "credit"]) {
        const el = $({ head: "head", head2: "head2", source: "src", label1: "l1", sub1: "s1", label2: "l2", sub2: "s2", credit: "credit" }[k]);
        el.textContent = str(V[k]);
        if (!str(V[k])) el.style.display = "none";
      }
      if (V.map1 && !$("m1").getAttribute("src")) $("m1").setAttribute("src", V.map1);
      if (V.map2 && !$("m2").getAttribute("src")) $("m2").setAttribute("src", V.map2);
      // one scale for both maps: the taller one (in km) is 640 px high
      const k1 = Math.max(0.1, Number(V.km1)), k2 = Math.max(0.1, Number(V.km2));
      const px = 640 / Math.max(k1, k2);
      $("m1").style.height = `${Math.round(k1 * px)}px`;
      $("m2").style.height = `${Math.round(k2 * px)}px`;

      const F = (f) => f / 30;
      const out = Number(V.out);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mapsize-a-dim", { opacity: 0 }, { opacity: 1, duration: F(10), ease: "power1.out" }, 0);
      // each map rises onto the baseline (15 frames)
      const land = (col, at) => {
        tl.fromTo(col, { opacity: 0, y: 70, scale: 0.96, transformOrigin: "50% 100%" }, { opacity: 1, y: 0, scale: 1, duration: F(15), ease: "expo.out" }, at);
      };
      land("#mapsize-a-c2", Number(V.at2));
      land("#mapsize-a-c1", Number(V.at1));
      // the claim (12 frames), the source 8 frames later; the second claim replaces it
      const hasHead = !!str(V.head), hasHead2 = !!str(V.head2);
      const hAt = Number(V.head_at), h2At = Number(V.head2_at);
      if (hasHead) tl.fromTo("#mapsize-a-head", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: F(12), ease: "power3.out" }, hAt);
      if (str(V.source)) tl.fromTo("#mapsize-a-src", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: F(12), ease: "power3.out" }, (hasHead ? hAt : 0.3) + F(8));
      if (hasHead2) {
        if (hasHead) tl.to("#mapsize-a-head", { opacity: 0, y: -16, duration: F(8), ease: "power2.in" }, h2At - F(8));
        tl.fromTo("#mapsize-a-head2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: F(12), ease: "power3.out" }, h2At);
      }
      if (str(V.credit)) tl.fromTo("#mapsize-a-credit", { opacity: 0 }, { opacity: 1, duration: F(10), ease: "none" }, Math.min(Number(V.at1), Number(V.at2)));
      // out (7 frames)
      tl.to(["#mapsize-a-top", "#mapsize-a-row", "#mapsize-a-credit"], { opacity: 0, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.to("#mapsize-a-dim", { opacity: 0, duration: F(9), ease: "power1.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(9));
      window.__timelines["mapsize-a"] = tl;
    })();
  </script>
</template>
