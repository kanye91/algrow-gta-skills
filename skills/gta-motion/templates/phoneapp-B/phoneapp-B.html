  <script>
    (() => {
      const R = "phoneapp-b";
      const root = document.getElementById(R);
      // this scene's values (declared defaults + its host's values), read once
      const V = { theme: "clean", post: "", head: "Follow a viral rise", source: "Confirmed by Rockstar", app: "Feed",
        handle1: "@ocean.nights", handle2: "@after.dark", handle3: "@keys.daily", pic1: "", pic3: "", avatar1: "", avatar2: "", avatar3: "",
        cut: 3.633, out: 7.0 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      root.dataset.theme = V.theme === "vice" ? "vice" : "clean";
      const $ = (s) => document.getElementById(R + "-" + s);
      $("h").textContent = String(V.head);
      $("src").textContent = String(V.source || "");
      const hasSrc = !!String(V.source || "").trim();
      if (!hasSrc) $("src").style.display = "none";
      $("app").textContent = String(V.app);
      const img = (box, file) => {
        const im = document.createElement("img");
        im.alt = "";
        im.src = file;
        box.appendChild(im);
      };
      // the feed: pictures and account pictures are the project's files; no file = a dark tile / no circle
      if (V.pic1) img($("pic1"), V.pic1);
      if (V.pic3) img($("pic3"), V.pic3);
      if (V.post) { img($("pic"), V.post); img($("fly"), V.post); }
      [1, 2, 3].forEach((i) => {
        $("h" + i).firstChild.nodeValue = String(V["handle" + i]) + " ";
        if (V["avatar" + i]) img($("av" + i), V["avatar" + i]);
        else { $("av" + i).style.display = "none"; $("who" + i).classList.add("no-av"); }
      });

      const tl = gsap.timeline({ paused: true });
      const F = (f) => f / 30;
      const O = Math.round(Number(V.cut) * 30) - 15; // the post starts to open 15 f before the cut, in frames (f94 as validated)
      const out = Number(V.out);
      const last = {};
      // every tween starts from the previous value of the same property, so the timeline is seek-safe
      function init(sel, props) {
        for (const k in props) last[sel + "|" + k] = props[k];
        tl.set(sel, props, 0);
      }
      function key(sel, props, atF, durF, ease) {
        const from = {};
        const to = { duration: F(durF), ease: ease || "none", immediateRender: false };
        for (const k in props) {
          const id = sel + "|" + k;
          from[k] = last[id];
          to[k] = props[k];
          last[id] = props[k];
        }
        tl.fromTo(sel, from, to, F(atF));
      }
      const S = (s) => "#" + R + "-" + s;

      // f2: the phone comes up from the bottom of the frame, tipping up to face us (15 f)
      init(S("phone"), { y: 1000, rotationX: 32, transformOrigin: "50% 100%", opacity: 1, scale: 1 });
      key(S("phone"), { y: 0, rotationX: 0 }, 2, 15, "expo.out");

      // f12: the app builds (header, posts, nav; 3 f apart)
      ["hdr", "p1", "p2", "p3", "nav"].forEach((s, i) => {
        init(S(s), { opacity: 0, y: 14 });
        key(S(s), { opacity: 1, y: 0 }, 12 + i * 3, 12, "power3.out");
      });

      // f40: finger drag up, lift at f60, the feed coasts one post down (322 px)
      init(S("tap"), { x: 230, y: 560, opacity: 0, scale: 0.8 });
      init(S("feed"), { y: 0 });
      key(S("tap"), { opacity: 1, scale: 1 }, 40, 4, "power2.out");
      key(S("tap"), { y: 300 }, 44, 16, "power1.inOut");
      key(S("feed"), { y: -260 }, 44, 16, "power1.inOut");
      key(S("tap"), { opacity: 0, scale: 1.12 }, 60, 5, "power1.in");
      key(S("feed"), { y: -322 }, 60, 18, "expo.out");

      // a tap on the picture of the second post (press 8 f before it opens, release 4 f before)
      key(S("tap"), { x: 203, y: 267, scale: 0.8 }, O - 14, 1, "none");
      key(S("tap"), { opacity: 1, scale: 1 }, O - 12, 4, "power2.out");
      key(S("tap"), { scale: 0.84 }, O - 8, 4, "power2.out");
      init(S("pic"), { scale: 1, opacity: 1, transformOrigin: "50% 50%" });
      key(S("pic"), { scale: 0.965 }, O - 8, 4, "power2.out");
      key(S("pic"), { scale: 1 }, O - 4, 4, "power2.out");
      key(S("tap"), { scale: 1 }, O - 4, 4, "power2.out");
      key(S("tap"), { opacity: 0 }, O - 3, 4, "power1.in");

      // the picture lifts out of the phone and grows into the frame (15 f, ease both ways); the phone falls back (9 f)
      // picture rect on screen after the scroll: x 773, y 274, 374 x 210
      const s0 = 374 / 1920;
      init(S("fly"), { x: 773, y: 274, scale: s0, borderRadius: 16 / s0, opacity: 0, transformOrigin: "0% 0%" });
      key(S("fly"), { opacity: 1 }, O, 1, "none");
      key(S("pic"), { opacity: 0 }, O, 1, "none");
      key(S("fly"), { x: 0, y: 0, scale: 1, borderRadius: 0 }, O, 15, "power3.inOut");
      key(S("phone"), { opacity: 0, scale: 1.06 }, O + 2, 9, "power2.in");
      // the project's next shot starts on this frame, on the same picture: the lifted copy hands over
      key(S("fly"), { opacity: 0 }, O + 15, 0.001, "none");

      // over the opened shot: a soft dim settles in behind the caption, then the caption and its source
      init(S("dim"), { opacity: 0 });
      key(S("dim"), { opacity: 1 }, O + 24, 14, "power1.inOut");
      init(S("h"), { opacity: 0, y: 20 });
      key(S("h"), { opacity: 1, y: 0 }, O + 28, 12, "power3.out");
      if (hasSrc) {
        init(S("src"), { opacity: 0, y: 12 });
        key(S("src"), { opacity: 1, y: 0 }, O + 40, 12, "power3.out");
      }

      // exit: the caption and its dim together, 7 f
      tl.fromTo([S("cap"), S("dim")], { opacity: 1 }, { opacity: 0, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(7));
      window.__timelines["phoneapp-b"] = tl;
    })();
  </script>
