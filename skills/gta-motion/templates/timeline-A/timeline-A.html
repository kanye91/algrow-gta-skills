<template>
  <style>
    /*GTA-THEME*/
    /* Timeline, rail run: up to six dates on one rail, the camera travelling along it. Each step lands on its word:
       the camera trucks to its stop, the filled rail runs up to it, its logo lands on the rail (the series) and its
       date under it. The step before keeps its logo (or its node) and loses its text, so two texts at most are ever on
       screen. On the last step the camera pulls back over the whole rail and the last stop lands bigger (`hero`).
       Full screen, on the video's ground (ground-B clean, ground-A vice). */
    #timeline-a { position: absolute; inset: 0; overflow: hidden; }
    #timeline-a *, #timeline-a *::before, #timeline-a *::after { box-sizing: border-box; margin: 0; }
    /* everything is built inside the stage: getElementById on the root id would find the host div in index.html */
    #timeline-a-stage { position: absolute; inset: 0; }
    /* clean: white on the coral ground, a soft rose shadow. vice: ink on the sunset ground (a gradient would vanish on it) */
    #timeline-a[data-theme="clean"] { --tl-ink: #FFFFFF; --tl-shadow: 0 3px 16px rgba(60, 10, 30, 0.5); --tl-mark: 0 2px 10px rgba(60, 10, 30, 0.4); }
    #timeline-a[data-theme="vice"] { --tl-ink: var(--ink); --tl-shadow: none; --tl-mark: none; }
    #timeline-a .el { position: absolute; left: 0; top: 0; }
    #timeline-a .fill { height: 6px; border-radius: 3px; background: var(--tl-ink); box-shadow: var(--tl-mark); }
    #timeline-a .track { height: 2px; border-radius: 1px; background: var(--tl-ink); }
    #timeline-a .node { border-radius: 50%; border: 2px solid var(--tl-ink); box-shadow: var(--tl-mark); }
    #timeline-a .logo { display: block; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.4)); }
    #timeline-a .date { font-family: var(--font-head); font-weight: var(--w-head); font-size: 104px; line-height: 1; letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums; color: var(--tl-ink); text-shadow: var(--tl-shadow); white-space: nowrap; }
    #timeline-a .date.hero { font-size: 120px; }
    #timeline-a .line { font-family: var(--font-body); font-weight: var(--w-body); font-size: 44px; line-height: 1.15; color: var(--tl-ink);
      text-shadow: var(--tl-shadow); white-space: nowrap; }
  </style>
  <div id="timeline-a" data-composition-id="timeline-a" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "date1", "type": "string", "label": "Step 1: the year or date the voice says", "default": "", "maxLength": 14},
      {"id": "label1", "type": "string", "label": "Step 1: what happened (dates without logos; empty = none)", "default": "", "maxLength": 22},
      {"id": "game1", "type": "string", "label": "Step 1: the game (the logo alt text)", "default": "", "maxLength": 40},
      {"id": "logo1", "type": "string", "label": "Step 1: the game logo file (empty = a date step)", "default": ""},
      {"id": "logo1_cx", "type": "number", "label": "Step 1 logo: its visual centre, in logo widths from the image centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at1", "type": "number", "label": "Step 1 lands at (s)", "default": 0.5, "min": 0.1, "unit": "s"},
      {"id": "date2", "type": "string", "label": "Step 2: the year or date (empty = no step 2)", "default": "", "maxLength": 14},
      {"id": "label2", "type": "string", "label": "Step 2: what happened", "default": "", "maxLength": 22},
      {"id": "game2", "type": "string", "label": "Step 2: the game", "default": "", "maxLength": 40},
      {"id": "logo2", "type": "string", "label": "Step 2: the game logo file", "default": ""},
      {"id": "logo2_cx", "type": "number", "label": "Step 2 logo: visual centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at2", "type": "number", "label": "Step 2 lands at (s)", "default": 1.6, "min": 0.1, "unit": "s"},
      {"id": "date3", "type": "string", "label": "Step 3: the year or date (empty = no step 3)", "default": "", "maxLength": 14},
      {"id": "label3", "type": "string", "label": "Step 3: what happened", "default": "", "maxLength": 22},
      {"id": "game3", "type": "string", "label": "Step 3: the game", "default": "", "maxLength": 40},
      {"id": "logo3", "type": "string", "label": "Step 3: the game logo file", "default": ""},
      {"id": "logo3_cx", "type": "number", "label": "Step 3 logo: visual centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at3", "type": "number", "label": "Step 3 lands at (s)", "default": 2.7, "min": 0.1, "unit": "s"},
      {"id": "date4", "type": "string", "label": "Step 4: the year or date (empty = no step 4)", "default": "", "maxLength": 14},
      {"id": "label4", "type": "string", "label": "Step 4: what happened", "default": "", "maxLength": 22},
      {"id": "game4", "type": "string", "label": "Step 4: the game", "default": "", "maxLength": 40},
      {"id": "logo4", "type": "string", "label": "Step 4: the game logo file", "default": ""},
      {"id": "logo4_cx", "type": "number", "label": "Step 4 logo: visual centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at4", "type": "number", "label": "Step 4 lands at (s)", "default": 3.8, "min": 0.1, "unit": "s"},
      {"id": "date5", "type": "string", "label": "Step 5: the year or date (empty = no step 5)", "default": "", "maxLength": 14},
      {"id": "label5", "type": "string", "label": "Step 5: what happened", "default": "", "maxLength": 22},
      {"id": "game5", "type": "string", "label": "Step 5: the game", "default": "", "maxLength": 40},
      {"id": "logo5", "type": "string", "label": "Step 5: the game logo file", "default": ""},
      {"id": "logo5_cx", "type": "number", "label": "Step 5 logo: visual centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at5", "type": "number", "label": "Step 5 lands at (s)", "default": 4.9, "min": 0.1, "unit": "s"},
      {"id": "date6", "type": "string", "label": "Step 6: the year or date (empty = no step 6)", "default": "", "maxLength": 14},
      {"id": "label6", "type": "string", "label": "Step 6: what happened", "default": "", "maxLength": 22},
      {"id": "game6", "type": "string", "label": "Step 6: the game", "default": "", "maxLength": 40},
      {"id": "logo6", "type": "string", "label": "Step 6: the game logo file", "default": ""},
      {"id": "logo6_cx", "type": "number", "label": "Step 6 logo: visual centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "at6", "type": "number", "label": "Step 6 lands at (s)", "default": 6.0, "min": 0.1, "unit": "s"},
      {"id": "gap", "type": "string", "label": "Gap label between two steps (13 years; empty = none)", "default": "", "maxLength": 16},
      {"id": "gap_step", "type": "number", "label": "The gap sits before this step (2 to 6; 0 = the last step)", "default": 0, "min": 0, "max": 6, "step": 1},
      {"id": "gap_at", "type": "number", "label": "The gap label lands at (s; 0 = with its step)", "default": 0, "min": 0, "unit": "s"},
      {"id": "hero", "type": "boolean", "label": "The last step lands bigger and the camera pulls back over the whole rail", "default": true},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 8.0, "min": 1.5, "unit": "s"}
    ]'>
    <div id="timeline-a-stage" data-layout-allow-overflow></div>
  </div>
  <script>
    (() => {
      const ID = "timeline-a";
      // this scene's values (declared defaults + its host's values), read once: the declaration is gone once mounted
      const V = { theme: "clean", gap: "", gap_step: 0, gap_at: 0, hero: true, out: 8.0 };
      const AT = [0.5, 1.6, 2.7, 3.8, 4.9, 6.0];
      for (let k = 1; k <= 6; k++) Object.assign(V, { ["date" + k]: "", ["label" + k]: "", ["game" + k]: "", ["logo" + k]: "", ["logo" + k + "_cx"]: 0, ["at" + k]: AT[k - 1] });
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#timeline-a, [data-composition-id="timeline-a"]').forEach((el) => el.setAttribute("data-theme", theme));
      const stage = document.getElementById("timeline-a-stage");
      const str = (v) => String(v == null ? "" : v).trim();

      // the steps: they stop at the first one with neither a date, a label nor a logo
      const steps = [];
      for (let k = 1; k <= 6; k++) {
        const s = { date: str(V["date" + k]), label: str(V["label" + k]), logo: str(V["logo" + k]), game: str(V["game" + k]),
          cx: Number(V["logo" + k + "_cx"]) || 0, at: Number(V["at" + k]) || 0 };
        if (!s.date && !s.label && !s.logo) break;
        steps.push(s);
      }
      const N = steps.length;
      const OUT = Number(V.out);
      const END = OUT + 7 / 30;
      const gapText = str(V.gap);
      let g = Math.round(Number(V.gap_step) || 0);
      g = g === 0 ? N - 1 : g - 1;                       // 0-based: the gap sits between step g-1 and step g
      const hasGap = !!gapText && N >= 2 && g >= 1 && g < N;
      const hero = (V.hero === true || V.hero === "true") && N >= 2;
      const logoMode = steps.some((s) => s.logo);

      // ---- which texts are on screen: two at most. A new step takes the place of the step before; the gap stays only if it fits.
      const texts = [];
      (() => {
        const ev = steps.map((s, i) => ({ t: s.at, i, gap: false }));
        const gapAt = Number(V.gap_at) > 0 ? Number(V.gap_at) : hasGap ? steps[g].at : 0;
        if (hasGap) ev.push({ t: gapAt, i: g, gap: true });
        ev.sort((a, b) => a.t - b.t || (a.gap ? 1 : 0) - (b.gap ? 1 : 0));
        const live = [];
        const drop = (r, t) => { r.tout = t; live.splice(live.indexOf(r), 1); };
        for (const e of ev) {
          if (!e.gap) {
            const s = steps[e.i];
            for (const r of [...live]) if (r.step < e.i) drop(r, e.t);
            const mine = [];
            if (s.date) mine.push({ kind: "date", step: e.i, tin: e.t, tout: END });
            if (s.label) mine.push({ kind: "label", step: e.i, tin: e.t, tout: END });
            mine.forEach((r) => { live.push(r); texts.push(r); });
            const gr = live.find((r) => r.kind === "gap");
            if (gr && live.length > 2) drop(gr, e.t);
          } else {
            while (live.length >= 2) {
              // the gap takes the place of the older texts first, then of its own step label (its date stays)
              const old = live.find((r) => r.step < e.i && r.kind === "label") || live.find((r) => r.step < e.i) || live.find((r) => r.kind === "label");
              if (!old) break;
              drop(old, e.t);
            }
            if (live.length < 2) { const r = { kind: "gap", step: e.i, tin: e.t, tout: END }; live.push(r); texts.push(r); }
          }
        }
      })();

      // ---- the parts
      const el = (cls, tag) => { const d = document.createElement(tag || "div"); d.className = "el " + cls; stage.appendChild(d); return d; };
      const track = el("track"), fill = el("fill");
      const nodes = steps.map(() => el("node"));
      const logos = steps.map((s) => {
        if (!s.logo) return null;
        const i = document.createElement("img");
        i.className = "el logo";
        i.alt = s.game || "";
        i.src = s.logo;
        stage.appendChild(i);
        return i;
      });
      texts.forEach((r) => {
        r.node = el(r.kind === "date" ? "date" : "line");
        r.node.textContent = r.kind === "date" ? steps[r.step].date : r.kind === "label" ? steps[r.step].label : gapText;
        if (r.kind === "date" && hero && r.step === N - 1) r.node.classList.add("hero");
        r.node.style.opacity = 0;
      });
      [track, fill, ...nodes].forEach((n) => (n.style.opacity = 0));
      logos.forEach((n) => n && (n.style.opacity = 0));

      // ---- measure (fonts and logos loaded), then lay out and build
      const cs = getComputedStyle(stage);
      const fHead = cs.getPropertyValue("--font-head").trim() || "Inter", fBody = cs.getPropertyValue("--font-body").trim() || "Inter";
      const ready = Promise.all([
        document.fonts.load(`800 104px ${fHead}`, "0123456789"), document.fonts.load(`800 120px ${fHead}`, "0123456789"),
        document.fonts.load(`600 40px ${fBody}`, "Aa"),
        ...logos.filter(Boolean).map((i) => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())),
      ]).catch(() => {});

      const build = () => {
        // text widths, measured on an off-screen copy with the same computed type (the scene may still be hidden)
        const probe = document.createElement("div");
        probe.style.cssText = "position:fixed;left:-30000px;top:0;visibility:hidden;white-space:nowrap;";
        document.body.appendChild(probe);
        texts.forEach((r) => {
          const c = getComputedStyle(r.node), s = document.createElement("span");
          for (const p of ["fontFamily", "fontWeight", "fontSize", "letterSpacing", "fontVariantNumeric", "fontFeatureSettings", "lineHeight"]) s.style[p] = c[p];
          s.style.display = "inline-block";
          s.textContent = r.node.textContent;
          probe.appendChild(s);
          r.w = s.getBoundingClientRect().width || s.offsetWidth;
          r.h = s.getBoundingClientRect().height || s.offsetHeight;
        });
        probe.remove();

        // the world: one stop per step on a rail at y 0, SEG apart (the gap's segment twice as long)
        // SEG 240 at zoom 2 = 480 px between stops: with the current stop at x 1200, the stop two back sits at x 240 (its logo
        // whole on screen) and the one three back at x -240 (its logo whole off screen), so no held frame cuts a logo
        const SEG = 240, ZS = 2.0, S = 160;
        const wx = [];
        steps.forEach((s, i) => wx.push(i === 0 ? 0 : wx[i - 1] + (hasGap && i === g ? 2 : 1) * SEG));
        // each logo: the same visual size (area) whatever its shape; the hero a size up. Its artwork's centre sits on the stop
        const L = steps.map((s, i) => {
          const im = logos[i];
          if (!im) return null;
          const r = im.naturalWidth && im.naturalHeight ? im.naturalWidth / im.naturalHeight : 1.3;
          const k = hero && i === N - 1 ? 1.6 : 1;
          return { w: S * k * Math.sqrt(r), h: (S * k) / Math.sqrt(r), cx: s.cx };
        });
        // the camera: x/y the world point at the frame centre, z the zoom. Stepped: zoomed in, the current stop at x 1200
        // (840 for the first, so the next two stops show at 1320 and 1800), the rail at y 650 (590 without logos).
        // Hero: pulled back so the whole rail fits title-safe.
        const RY = logoMode ? 650 : 590;
        const camStep = (i) => ({ x: wx[i] - ((i === 0 ? 840 : 1200) - 960) / ZS, y: -(RY - 540) / ZS, z: ZS });
        const textOf = (i, kind) => texts.find((r) => r.step === i && r.kind === kind);
        const camHero = () => {
          const i = N - 1, l0 = L[0], lN = L[i];
          const left = Math.max(l0 ? l0.w / 2 : 0, 14);
          const d = textOf(i, "date"), lb = textOf(i, "label");
          const rightTxt = Math.max(d ? d.w / 2 : 0, lb ? lb.w / 2 : 0);
          const span = wx[i] - wx[0];
          const ry = logoMode ? 560 : 540;
          let z = 1.25, x0;
          if (logoMode) {
            // the logos fill the action-safe width (x 120 to 1800); the hero date is kept title-safe on its own
            // and the hero date stays centred under its stop: if it would pass x 1728, everything slides left (zooming out
            // a little more if the first logo would then pass x 120)
            const ext = span + left + (lN ? lN.w / 2 : 14);
            const half = Math.max(rightTxt, 0);
            z = Math.min(1.25, 1680 / ext);
            for (; z > 0.4; z -= 0.005) {
              x0 = 120 + (1680 - ext * z) / 2 + left * z;             // where stop 1 lands on screen
              const over = x0 + span * z + half - 1728;
              if (over > 0) x0 -= over;
              if (x0 - left * z >= 120) break;
            }
          } else {
            const width = (zz) => span * zz + left * zz + Math.max(14, rightTxt);
            while (z > 0.4 && width(z) > 1536) z -= 0.005;
            x0 = 192 + (1536 - width(z)) / 2 + left * z;
          }
          return { x: wx[0] - (x0 - 960) / z, y: -(ry - 540) / z, z };
        };
        const cams = steps.map((s, i) => (hero && i === N - 1 ? camHero() : camStep(i)));

        const F = (f) => f / 30;
        const c01 = (v) => Math.min(1, Math.max(0, v));
        const eIO = gsap.parseEase("power3.inOut"), eO = gsap.parseEase("power3.out"), eO1 = gsap.parseEase("power1.out"), eI = gsap.parseEase("power2.in");
        const P = (t, t0, d, e) => e(c01((t - t0) / d));
        const lerp = (a, b, p) => a + (b - a) * p;
        const MOVE = 0.5;
        // camera moves: each from where the camera is when it starts (in case two steps come close together)
        const moves = [];
        let base = cams[0];
        for (let i = 1; i < N; i++) {
          const prev = moves[moves.length - 1];
          if (prev) { const p = P(steps[i].at, prev.t, MOVE, eIO); base = { x: lerp(prev.a.x, prev.b.x, p), y: lerp(prev.a.y, prev.b.y, p), z: lerp(prev.a.z, prev.b.z, p) }; }
          moves.push({ t: steps[i].at, a: base, b: cams[i] });
        }
        const camAt = (t) => {
          let c = cams[0];
          for (const m of moves) {
            if (t < m.t) break;
            const p = P(t, m.t, MOVE, eIO);
            c = { x: lerp(m.a.x, m.b.x, p), y: lerp(m.a.y, m.b.y, p), z: lerp(m.a.z, m.b.z, p) };
          }
          return c;
        };
        const at0 = steps.length ? steps[0].at : 0;
        // the exit: everything together, 7 frames
        const gone = (t) => 1 - P(t, OUT, F(7), eI);
        const sink = (t) => -12 * P(t, OUT, F(7), eI);
        // a text: fade + 20 px rise in 0.3 s (from 0.2 s after its word), out in 0.2 s
        const textVis = (r, t) => {
          // it starts as the text before has left (0.2 s), so two never overlap, and still lands within 0.5 s of its word
          const t0 = r.tin + 0.2;
          const o = P(t, t0, 0.25, eO1) * (1 - P(t, r.tout, F(6), eI)) * gone(t);
          const dy = 20 * (1 - P(t, t0, 0.3, eO)) - 10 * P(t, r.tout, F(6), eI) + sink(t);
          return { o, dy };
        };

        const render = (t) => {
          const c = camAt(t);
          const sx = (x) => 960 + (x - c.x) * c.z, sy = (y) => 540 + (y - c.y) * c.z;
          const ry = sy(0), G = gone(t), dyOut = sink(t);
          // the rail: the track draws out from stop 1 with the first step, the fill runs to each stop as it lands
          if (N) {
            const drawn = P(t, at0, 0.45, eIO);
            const x0 = sx(wx[0]), xN = sx(wx[N - 1]);
            const tw = Math.max(0, (xN - x0) * drawn);
            track.style.opacity = drawn > 0 ? G : 0;
            track.style.width = tw + "px";
            track.style.transform = `translate(${x0}px, ${ry - 1 + dyOut}px)`;
            let head = wx[0];
            for (let i = 1; i < N; i++) if (t >= steps[i].at) head = lerp(wx[i - 1], wx[i], P(t, steps[i].at, 0.45, eIO));
            const fw = Math.max(0, sx(head) - x0);
            fill.style.opacity = fw > 0.5 ? G : 0;
            fill.style.width = fw + "px";
            fill.style.transform = `translate(${x0}px, ${ry - 3 + dyOut}px)`;
          }
          steps.forEach((s, i) => {
            // the node: hollow until the fill reaches it, then filled; the current stop's node is a size up
            const n = nodes[i];
            const shown = t >= at0 ? P(t, at0 + 0.08 * Math.min(i, 3), 0.3, eO1) : 0;
            const reach = i === 0 ? at0 + 0.05 : s.at + 0.3;
            const filled = t >= reach;
            const grow = P(t, reach, 0.15, eO);
            const next = i + 1 < N ? steps[i + 1].at + 0.3 : Infinity;
            const shrink = P(t, next, 0.15, eO);
            const d = filled ? lerp(lerp(16, 26, grow), 18, shrink) : 18;
            n.style.width = n.style.height = d + "px";
            n.style.background = filled ? "var(--tl-ink)" : "transparent";
            n.style.opacity = shown * G;
            n.style.transform = `translate(${sx(wx[i]) - d / 2}px, ${ry - d / 2 + dyOut}px)`;
            // the logo: lands on its stop (fade, 26 px rise, a hair of scale), its artwork centred on the stop
            const im = logos[i], l = L[i];
            if (im && l) {
              const t0 = s.at + 0.05;
              const o = P(t, t0, 0.25, eO1) * G;
              const k = lerp(0.92, 1, P(t, t0, 0.45, eO));
              const w = l.w * c.z * k, h = l.h * c.z * k;
              const cxs = sx(wx[i] - l.cx * l.w) ;
              const bottom = ry - 12 * c.z;
              im.style.opacity = o;
              im.style.width = w + "px";
              im.style.height = h + "px";
              im.style.transform = `translate(${cxs - w / 2}px, ${bottom - h + 26 * (1 - P(t, t0, 0.45, eO)) + dyOut}px)`;
            }
          });
          // the texts, in screen pixels (they keep their size when the camera pulls back), inside title-safe
          texts.forEach((r) => {
            const v = textVis(r, t);
            const x = r.kind === "gap" ? (sx(wx[r.step - 1]) + sx(wx[r.step])) / 2 : sx(wx[r.step]);
            const cxClamp = Math.min(1728 - r.w / 2, Math.max(192 + r.w / 2, x));
            let top;
            if (r.kind === "date") top = ry + 40;
            else {
              // a label sits above its stop (above its logo when it has one); the gap above the rail, mid-segment
              const l = L[r.step];
              const above = r.kind === "label" && l ? ry - 12 * c.z - l.h * c.z - 18 : ry - 30;
              top = above - r.h;
            }
            r.node.style.opacity = v.o;
            r.node.style.transform = `translate(${cxClamp - r.w / 2}px, ${top + v.dy}px)`;
          });
        };

        const clock = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(clock, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: () => render(clock.t) }, 0);
        tl.set({}, {}, END);
        window.__timelines["timeline-a"] = tl;
        render(0);
      };
