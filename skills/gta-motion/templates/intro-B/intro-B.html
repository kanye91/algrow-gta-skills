<template>
  <style>
    /*GTA-THEME*/
    /* Intro, logo door: the video opens on the ground colours with the game's logo landing in the middle (and an
       optional title under it). The logo's artwork fades and leaves a logo-shaped window onto the project's first shot,
       playing underneath; then the camera dives through the window and the shot fills the frame. */
    #intro-b { position: absolute; inset: 0; overflow: hidden; }
    #intro-b[data-theme="clean"] {
      --ib-plate:
        radial-gradient(ellipse 85% 78% at 50% 46%, transparent 55%, rgba(84, 10, 34, 0.32) 100%),
        radial-gradient(ellipse 60% 56% at 26% 12%, rgba(255, 190, 72, 0.6) 0%, rgba(255, 150, 90, 0.22) 45%, rgba(255, 150, 90, 0) 72%),
        radial-gradient(ellipse 55% 50% at 88% 94%, rgba(255, 98, 137, 0.32) 0%, rgba(255, 98, 137, 0) 70%),
        linear-gradient(160deg, #ec4e7c 0%, #d53f5f 52%, #b3324d 100%);
      --ib-title: #FFFFFF; --ib-title-shadow: 0 6px 30px rgba(60, 10, 30, 0.45);
    }
    #intro-b[data-theme="vice"] {
      --ib-plate:
        radial-gradient(ellipse 85% 78% at 50% 46%, transparent 54%, rgba(128, 24, 60, 0.3) 100%),
        radial-gradient(ellipse 62% 52% at 22% 6%, rgba(255, 222, 140, 0.6) 0%, rgba(255, 222, 140, 0) 70%),
        linear-gradient(168deg, #ffbe48 0%, #ff8a6a 44%, #ff6289 80%, #ef507f 100%);
      --ib-title: #241329; --ib-title-shadow: none;
    }
    #intro-b-door { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    /* the plate with the logo-shaped window (mask set in the script), and the same plate whole on top until `fill` */
    #intro-b-hole, #intro-b-solid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; background: var(--ib-plate); }
    #intro-b-mid { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 36px; }
    /* the spacer is the title's height: the logo stays centred on the window with or without a title */
    #intro-b-mid .sp { height: 72px; flex: none; }
    #intro-b-art { display: block; height: auto; flex: none; filter: drop-shadow(0 16px 40px rgba(0, 0, 0, 0.38)); }
    #intro-b-title { height: 72px; flex: none; white-space: nowrap; font-family: var(--font-head); font-weight: var(--w-head);
      font-size: 64px; line-height: 72px; color: var(--ib-title); text-shadow: var(--ib-title-shadow); }
  </style>
  <div id="intro-b" data-composition-id="intro-b" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "game", "type": "string", "label": "The game (the logo alt text)", "default": "Grand Theft Auto VI", "maxLength": 40},
      {"id": "logo", "type": "string", "label": "The game logo file (transparent PNG)", "default": ""},
      {"id": "shape", "type": "string", "label": "The logo silhouette, solid inside (make_scene makes it from logo; empty = the logo itself)", "default": ""},
      {"id": "logo_cx", "type": "number", "label": "The logo: its visual centre, in logo widths from the image centre (logos.json cx)", "default": 0, "min": -0.3, "max": 0.3},
      {"id": "title", "type": "string", "label": "Optional line under the logo (empty = none)", "default": "", "maxLength": 34},
      {"id": "width", "type": "number", "label": "Logo width", "default": 720, "min": 520, "max": 900, "unit": "px"},
      {"id": "doorx", "type": "number", "label": "Dive point, x from the logo centre (logo widths)", "default": -0.106},
      {"id": "doory", "type": "number", "label": "Dive point, y from the logo centre (logo widths)", "default": -0.039},
      {"id": "doorr", "type": "number", "label": "Solid radius around the dive point (logo widths)", "default": 0.215, "min": 0.01},
      {"id": "fill", "type": "number", "label": "The logo turns into a window at (s)", "default": 1.2, "min": 0.6, "unit": "s"},
      {"id": "out", "type": "number", "label": "The dive starts at (s)", "default": 2.0, "min": 1.0, "unit": "s"}
    ]'>
    <div id="intro-b-door" data-layout-allow-overflow>
      <div id="intro-b-hole"></div>
      <div id="intro-b-solid"></div>
      <div id="intro-b-mid" data-layout-allow-overflow><div class="sp"></div></div>
    </div>
  </div>
  <script>
    (() => {
      const V = { theme: "clean", game: "Grand Theft Auto VI", logo: "", shape: "", title: "", logo_cx: 0, width: 720, doorx: -0.106, doory: -0.039, doorr: 0.215, fill: 1.2, out: 2.0 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#intro-b, [data-composition-id="intro-b"]').forEach((el) => el.setAttribute("data-theme", theme));
      const W = Math.round(Number(V.width) || 720);
      const src = String(V.logo || "").trim();
      const mid = document.getElementById("intro-b-mid");
      const art = document.createElement("img");
      art.id = "intro-b-art";
      art.alt = String(V.game || "");
      if (src) art.src = src;
      art.style.width = W + "px";
      mid.appendChild(art);
      const ttl = String(V.title || "").trim();
      const title = document.createElement("div");
      if (ttl) { title.id = "intro-b-title"; title.textContent = ttl; } else title.className = "sp";
      // the line centres on the logo's artwork, not on its image box
      if (ttl) { title.style.position = "relative"; title.style.left = Math.round((Number(V.logo_cx) || 0) * W) + "px"; }
      mid.appendChild(title);
      // the window: the logo's silhouette cut out of the plate, centred like the artwork. The silhouette is the logo
      // solid inside (logo_shape.mjs), so no sliver of the ground floats in the window where the artwork had gaps
      const hole = document.getElementById("intro-b-hole");
      const cut = String(V.shape || "").trim() || src;
      if (cut) {
        hole.style.maskImage = 'url("' + cut.replace(/"/g, "%22") + '"), linear-gradient(#000 0 0)';
        hole.style.maskSize = W + "px auto, 100% 100%";
        hole.style.maskPosition = "50% 50%, 0 0";
        hole.style.maskRepeat = "no-repeat, no-repeat";
        hole.style.maskComposite = "exclude";
      }

      const F = (f) => f / 30;
      const fill = Number(V.fill) || 1.2, out = Number(V.out) || 2.0;
      // the dive point: a solid part of the logo (assets/logos/logos.json "door"); scaled about it, the window grows
      // until its solid disc covers the frame's farthest corner
      const px = 960 + Number(V.doorx) * W, py = 540 + Number(V.doory) * W, rr = Math.max(0.05, Number(V.doorr)) * W;
      const far = Math.max(Math.hypot(px, py), Math.hypot(1920 - px, py), Math.hypot(px, 1080 - py), Math.hypot(1920 - px, 1080 - py));
      const S = (far / rr) * 1.12;
      const tl = gsap.timeline({ paused: true });
      tl.set("#intro-b-door", { transformOrigin: px + "px " + py + "px" }, 0);
      // in: the logo lands on the ground, a hair of scale settling (13 frames), opaque after 6; the line rises under it
      tl.fromTo(art, { scale: 1.12, opacity: 0 }, { scale: 1, opacity: 1, duration: F(13), ease: "expo.out" }, 0);
      if (ttl) tl.fromTo(title, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: F(12), ease: "power3.out" }, F(8));
      // the artwork and the whole plate fade together (9 frames): the first shot shows through the logo's shape
      tl.to([art, "#intro-b-solid"], { opacity: 0, duration: F(9), ease: "power1.inOut" }, fill);
      // out: the dive, 9 frames accelerating through the window; the scene ends on the first shot
      tl.to("#intro-b-door", { scale: S, duration: F(9), ease: "power2.in" }, out);
      tl.set("#intro-b-door", { opacity: 0 }, out + F(9));
      tl.set({}, {}, out + F(10));
      window.__timelines["intro-b"] = tl;
    })();
  </script>
</template>
