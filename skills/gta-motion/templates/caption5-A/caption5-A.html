<template>
  <style>
    /*GTA-THEME*/
    #caption5-a { position: absolute; inset: 0; overflow: hidden; }
    /* soft neutral dim behind the lower third, comes and goes with the graphic (was baked into the lab footage) */
    #caption5-a-dim {
      position: absolute; inset: 0; opacity: 0;
      background: radial-gradient(1250px 420px at 560px 930px, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0.408) 10%, rgba(0, 0, 0, 0.376) 20%,
        rgba(0, 0, 0, 0.329) 30%, rgba(0, 0, 0, 0.272) 40%, rgba(0, 0, 0, 0.21) 50%, rgba(0, 0, 0, 0.148) 60%, rgba(0, 0, 0, 0.091) 70%,
        rgba(0, 0, 0, 0.044) 80%, rgba(0, 0, 0, 0.012) 90%, rgba(0, 0, 0, 0) 100%);
    }
    /* the validated headline: its own tracking, shadow and optical nudge onto the x 120 edge */
    #caption5-a[data-theme="clean"] {
      --cap-head-color: #ffffff; --cap-head-ls: -0.025em; --cap-head-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      --cap-head-filter: none; --cap-head-nudge: -5px;
    }
    #caption5-a[data-theme="vice"] {
      --cap-head-color: #ffbe48; --cap-head-ls: 0.005em; --cap-head-shadow: none;
      --cap-head-filter: drop-shadow(0 0 1.5px rgba(36, 19, 41, 0.95)) drop-shadow(0 4px 0 rgba(36, 19, 41, 0.8)) drop-shadow(0 0 22px rgba(36, 19, 41, 0.6));
      --cap-head-nudge: -6.5px;
    }
    /* vice: each word filled with its slice of one marigold to flamingo ramp (--g0 / --g1, set by the script) */
    #caption5-a[data-theme="vice"] .w {
      background-image: linear-gradient(90deg, var(--g0, #ffbe48), var(--g1, #ff6289)); -webkit-background-clip: text;
      background-clip: text; color: transparent; padding: 0 0.04em; margin-left: -0.04em; margin-right: -0.04em;
    }
    #caption5-a .w { display: inline-block; }
    #caption5-a-cap { position: absolute; left: 120px; top: 742px; display: flex; flex-direction: column; align-items: flex-start; }
    #caption5-a-head {
      margin-top: 26px; margin-left: var(--cap-head-nudge); font-family: var(--font-head); font-weight: 800; color: var(--cap-head-color);
      font-size: 92px; line-height: 1; letter-spacing: var(--cap-head-ls); white-space: nowrap; text-shadow: var(--cap-head-shadow);
      filter: var(--cap-head-filter);
    }
    /* the source box: a sentence that ends on the outlet's logo, or on its name when there is no logo */
    #caption5-a-src {
      height: 92px; padding: 0 30px; border-radius: 20px; background: var(--box-bg); display: flex; align-items: center;
      box-shadow: var(--box-shadow); transform-origin: left center;
    }
    #caption5-a-srcw {
      font-family: var(--font-body); font-weight: 600; font-size: var(--size-source); line-height: 1; letter-spacing: -0.01em;
      white-space: nowrap; color: var(--box-ink);
    }
    #caption5-a-logo { display: block; width: auto; height: 37.72px; margin-left: 20px; }
  </style>
  <div id="caption5-a" data-composition-id="caption5-a" data-theme="clean" data-width="1920" data-height="1080"
    data-composition-variables='[
      {"id": "theme", "type": "enum", "label": "Theme", "default": "clean", "options": [{"value": "clean", "label": "Clean"}, {"value": "vice", "label": "Vice City"}]},
      {"id": "claim", "type": "string", "label": "Claim, one line (the voice words)", "default": "", "maxLength": 28},
      {"id": "source", "type": "string", "label": "Source words before the outlet", "default": "Confirmed by", "maxLength": 16},
      {"id": "outlet", "type": "string", "label": "Outlet name (shown as text when there is no logo)", "default": "", "maxLength": 32},
      {"id": "logo", "type": "string", "label": "Outlet logo file (empty = the name as text)", "default": ""},
      {"id": "logo_h", "type": "number", "label": "Logo height", "default": 37.72, "min": 20, "max": 64, "unit": "px"},
      {"id": "logo_trim", "type": "number", "label": "Space taken off after the logo", "default": 0, "min": 0, "max": 24, "unit": "px"},
      {"id": "out", "type": "number", "label": "Exit starts at (s)", "default": 4.1333, "min": 1.8, "unit": "s"}
    ]'>
    <div id="caption5-a-dim"></div>
    <div id="caption5-a-cap" data-layout-allow-overflow>
      <div id="caption5-a-src"><span id="caption5-a-srcw"></span><img id="caption5-a-logo" alt="" /></div>
      <div id="caption5-a-head" data-layout-allow-overflow></div>
    </div>
  </div>
  <script>
    (() => {
      const ID = "caption5-a";
      // this scene's values (declared defaults + the host's values). Read once: the declaration is gone once mounted.
      const V = { theme: "clean", claim: "", source: "Confirmed by", outlet: "", logo: "", logo_h: 37.72, logo_trim: 0, out: 4.1333 };
      try {
        const got = window.__hyperframes.getVariables() || {};
        for (const k of Object.keys(V)) if (got[k] !== undefined && got[k] !== null) V[k] = got[k];
      } catch (e) {}
      const theme = V.theme === "vice" ? "vice" : "clean";
      document.querySelectorAll('#caption5-a, [data-composition-id="caption5-a"]').forEach((el) => el.setAttribute("data-theme", theme));
      const $ = (s) => document.getElementById(ID + s);

      // the claim, one span per word (vice gives each word its slice of one ramp)
      const head = $("-head");
      const words = String(V.claim || "").trim().split(/\s+/).filter(Boolean).map((w, i) => {
        if (i) head.appendChild(document.createTextNode(" "));
        const s = document.createElement("span");
        s.className = "w";
        s.textContent = w;
        return head.appendChild(s);
      });
      const SUN = [255, 190, 72], FLAM = [255, 98, 137];
      const mix = (t) => `rgb(${SUN.map((c, i) => Math.round(c + (FLAM[i] - c) * t)).join(",")})`;
      const total = words.reduce((n, w) => n + w.textContent.length, 0) || 1;
      let seen = 0;
      words.forEach((w) => { w.style.setProperty("--g0", mix(seen / total)); seen += w.textContent.length; w.style.setProperty("--g1", mix(seen / total)); });

      // the source: "Confirmed by [logo]"; no logo file = the outlet's name as text (a logo is never invented)
      const logo = $("-logo"), hasLogo = !!String(V.logo || "").trim();
      if (hasLogo) {
        $("-srcw").textContent = String(V.source || "");
        logo.src = V.logo;
        logo.alt = String(V.outlet || "");
        logo.style.height = Number(V.logo_h) + "px";
        logo.style.marginRight = -Number(V.logo_trim) + "px";
      } else {
        $("-srcw").textContent = `${V.source || ""} ${V.outlet || ""}`.trim();
        logo.style.display = "none";
      }

      const F = (f) => f / 30;
      const out = Number(V.out);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo($("-dim"), { opacity: 0 }, { opacity: 1, duration: F(12), ease: "power1.out" }, 0);
      // in: the source box leads (fade + 16 px rise + a hair of scale, 11 frames), the claim follows 5 frames later
      tl.fromTo($("-src"), { opacity: 0, y: 16, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: F(11), ease: "power3.out" }, F(6));
      tl.fromTo(head, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: F(12), ease: "power3.out" }, F(11));
      // out: together, 7 frames; the dim goes with them
      tl.to([$("-src"), head], { opacity: 0, y: 8, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.to($("-dim"), { opacity: 0, duration: F(7), ease: "power2.in", immediateRender: false }, out);
      tl.set({}, {}, out + F(7));
      window.__timelines["caption5-a"] = tl;
    })();
  </script>
</template>
